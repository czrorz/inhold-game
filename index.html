:root{font-family:"Inhold Pixel","Microsoft YaHei",monospace;color:#303030;background:#dbdbdb;--ink:#303030;--surround:#e6e6e6;--paper:#e6e6e6;--red:#f00;--muted:#595959;--scrollbar-track:#bcbcbc;--scrollbar-size:6px}
*{box-sizing:border-box}body{margin:0;zoom:var(--game-zoom,1)}button,canvas,dialog{border:0;outline:none}button,canvas{-webkit-tap-highlight-color:transparent}button{appearance:none;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:is(:disabled,[aria-disabled="true"]){opacity:.42;cursor:default}[hidden]{display:none!important}
.game-scrollport{scrollbar-width:none}
.game-scrollport::-webkit-scrollbar{display:none}
.game-scrollbar{position:fixed;z-index:3;background:var(--scrollbar-track);pointer-events:auto;touch-action:none;user-select:none}
.game-scrollbar-thumb{position:absolute;inset:0 auto auto 0;background:var(--muted)}
.game-scrollbar-thumb:hover,.game-scrollbar[data-dragging] .game-scrollbar-thumb{background:var(--ink)}
@property --left-side{syntax:"<color>";inherits:false;initial-value:#d0d0d0}
@property --right-side{syntax:"<color>";inherits:false;initial-value:#d0d0d0}
#frame{position:relative;height:var(--game-height,100dvh);width:var(--game-width,100vw);overflow:hidden;--surround:#d0d0d0;--active-side:#d4d4d4;--left-side:var(--surround);--right-side:var(--surround);--arena-end:calc(var(--arena-start,50%) + var(--arena-w,0px));background:linear-gradient(to right,var(--left-side) var(--arena-start,50%),var(--surround) var(--arena-start,50%) var(--arena-end),var(--right-side) var(--arena-end));transition:--left-side var(--left-side-time,400ms) ease-in-out,--right-side var(--right-side-time,400ms) ease-in-out}
#frame[data-phase="battle"][data-side-flash="card"]{--left-side:var(--active-side);--left-side-time:120ms}#frame[data-phase="battle"][data-side-flash="enemy"]{--right-side:var(--active-side);--right-side-time:120ms}#sheet{position:absolute;left:var(--board-left);top:var(--board-top);width:var(--screen-w);height:var(--screen-h);container-type:inline-size}
#frame[data-phase="reward"]{background:var(--surround)}
#board{width:100%;height:100%;display:block;touch-action:none}
.anchor{position:absolute}#hud{z-index:1;top:var(--hud-top,8px);left:var(--hud-left,10px);width:var(--hud-width,264px);display:grid;gap:var(--hud-row-gap,7px);pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{flex:none;font-size:32px;line-height:1;color:#292929}
#utility{display:flex;justify-content:flex-end;align-items:flex-start;gap:0 var(--hud-menu-gap,6px);pointer-events:auto}
.flat{flex:none;padding:4px 2px;background:transparent;color:var(--muted);font-size:16px;white-space:nowrap}
.flat:hover,.quiet:hover:not(:disabled),#equip-help:hover,#info button:hover,
.restart-choice:hover,.opening-mode .restart-choice:has(input:checked){text-decoration:underline;text-underline-offset:4px}
#metrics{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:4px;color:#555;font-size:16px;line-height:1.1}
.stat{min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
#round-stat{display:flex;align-items:baseline;gap:2px;min-width:0}

<script>
'use strict';
const key = (x, y) => x + ',' + y;
function normalize(cells) {
  if (!cells.length) return [];
  let left = Infinity, top = Infinity;
  const unique = new Map();
  for (const [x, y] of cells) {
    left = Math.min(left, x);
    top = Math.min(top, y);
    unique.set(key(x, y), [x, y]);
  }
  return [...unique.values()].map(([x, y]) => [x - left, y - top])
    .sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}

function bounds(cells) {
  if (!cells.length) return { w: 0, h: 0, left: 0, top: 0 };
  let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
  for (const [x, y] of cells) {
    left = Math.min(left, x); right = Math.max(right, x);
    top = Math.min(top, y); bottom = Math.max(bottom, y);
  }
  return { w: right - left + 1, h: bottom - top + 1, left, top };
}

function seedValue(seed) {
  if (typeof seed === 'number' && Number.isFinite(seed)) return seed >>> 0;
  if (seed !== undefined && seed !== null) {
    let hash = 2166136261;
    for (const ch of String(seed)) hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619);
    return hash >>> 0;
  }
  if (globalThis.crypto?.getRandomValues) return globalThis.crypto.getRandomValues(new Uint32Array(1))[0];
  return Math.floor(Math.random() * 4294967296);
}

// Each purpose has its own stable ID for deriving a random stream.
const RANDOM_PURPOSE = {
  startingTile:1, experimentTile:2, enemyArea:3, enemyCount:4, enemyWeights:5,
  enemyRemainder:6, enemySplit:8, enemyShape:9, enemyMarks:10,
  enemyHollows:11, enemySeams:12, previewSeams:13, mergedEnemySeams:14,
  fragment:15, potionType:16, potionCarrier:17, potionCells:18, enemySwap:19,
  tileWear:20, growthTile:21, growthCell:22, giftDensity:23, giftShape:24,
  dissolveTexture:25, dissolveCell:26, enemyPull:27,
  enemyGrowth:28, enemyGrowthVariation:29, enemyHollowBias:30, enemySizeBias:31,
  enemyStraightness:32
};

function splitMix64(value) {
  let bits=BigInt.asUintN(64,value);
  bits=BigInt.asUintN(64,(bits^(bits>>30n))*0xbf58476d1ce4e5b9n);
  bits=BigInt.asUintN(64,(bits^(bits>>27n))*0x94d049bb133111ebn);
  return bits^(bits>>31n);
}

function generator(seed,round,purpose,index=0) {
  // Pack the seed, round, purpose and index into 32, 8, 8 and 16 bits.
  const streamKey=BigInt(seed>>>0)|(BigInt(round)<<32n)|(BigInt(RANDOM_PURPOSE[purpose])<<40n)|(BigInt(index)<<48n);
  const step=0x9e3779b97f4a7c15n;
  const first=splitMix64(streamKey+step);
  const second=splitMix64(streamKey+2n*step);
  let a=Number(first&0xffffffffn), b=Number(first>>32n);
  let c=Number(second&0xffffffffn), d=Number(second>>32n);
  // xoshiro128** 1.1 by David Blackman and Sebastiano Vigna.
  return () => {
    const output=Math.imul(b,5);
    const result=Math.imul((output<<7)|(output>>>25),9);
    const shifted=b<<9;
    c^=a;
    d^=b;
    b^=c;
    a^=d;
    c^=shifted;
    d=(d<<11)|(d>>>21);
    return (result>>>0)/4294967296;
  };

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const randomItem = (items, rng) => items[Math.floor(rng() * items.length)];
const rangeInt = (a,b,rng) => a+Math.floor(rng()*(b-a+1));

const weighted = (items, rng) => {
  let value = rng()*items.reduce((sum,item) => sum+item.weight,0);
  for (const item of items) {
    value -= item.weight;
    if (value < 0) return item;
  }
  return items.at(-1);
};

function walk(area, maxSpan, rng, material=false, branchRate=.24, straightness=5) {
  const steps=material ? CARDINAL : STEPS;
  const cells = [[0,0]], occupied = new Set(['0,0']);
  let minX=0,maxX=0,minY=0,maxY=0, direction=-1;
  const options = ([x,y], preferred) => {
    const result = [];
    for (let i=0;i<steps.length;i++) {
      const xx=x+steps[i][0], yy=y+steps[i][1], id=key(xx,yy);
      if (occupied.has(id) || Math.max(maxX,xx)-Math.min(minX,xx)>=maxSpan ||
          Math.max(maxY,yy)-Math.min(minY,yy)>=maxSpan) continue;
      const diff=Math.min((i-preferred+steps.length)%steps.length,(preferred-i+steps.length)%steps.length);
      result.push({xx,yy,id,i,weight:preferred<0 ? 1 : diff===0 ? straightness : diff===1 ? 2.1 : .6});
    }
    return result;
  };
  while (cells.length < area) {
    const branch=rng()<branchRate;
    let available=options(branch ? randomItem(cells,rng) : cells.at(-1),branch ? -1 : direction);
    if (!available.length) {
      const starts=cells.map(cell=>options(cell,-1)).filter(choices=>choices.length);
      if (!starts.length) break;
      available=material ? starts.flat() : randomItem(starts,rng);
    }
    const {xx,yy,id,i}=weighted(available,rng);
    cells.push([xx,yy]); occupied.add(id); direction=i;
    minX=Math.min(minX,xx); maxX=Math.max(maxX,xx);
    minY=Math.min(minY,yy); maxY=Math.max(maxY,yy);
  }
  return normalize(cells);
}

function finishGeneration(steps) {
  let result=steps.next();
  while (!result.done) result=steps.next();
  return result.value;
}

function rolledShape(area,span,target,rng,split=false,material=false) {
  return finishGeneration(rollShapeSteps(area,span,{target},rng,split,material));
}

function* rollShapeSteps(area,span,{target,min=target,max=target},rng,split,material,attemptLimit=26,growth) {
  let best, bestScore=Infinity;
  const acceptFirst=target===undefined;
  const singleShapeFallbackStart=attemptLimit-6;
  for (let attempt=0;attempt<attemptLimit;attempt++) {
    if (attempt>0) yield;
    const branchRate=growth?.branchRate??(.08+rng()*.36);
    const straightness=growth?.straightness??(3+rng()*9);
    let cells=walk(area,span,rng,material,branchRate,straightness);
    let shapeBox;
    if (split && area>=8) {
      const first=rangeInt(Math.ceil(area*.42),Math.ceil(area*.63),rng);
      const a=walk(first,span,rng,false,growth?.branchRate??.23,growth?.straightness??6);
      const b=walk(area-first,span,rng,false,growth?.branchRate??.2,growth?.straightness??7);
      const offset=bounds(a).w + rangeInt(1,4,rng);
      const shift=rangeInt(-2,3,rng);
      const combined=normalize(a.concat(b.map(([x,y]) => [x+offset,y+shift])));
      const box=bounds(combined);
      if (box.w<=span&&box.h<=span) {cells=combined;shapeBox=box;}
      else if (attempt<singleShapeFallbackStart) continue;
    }
    if (cells.length!==area) continue;
    const {w,h}=shapeBox??bounds(cells);
    const density=area/(w*h);
    const nearest=clamp(density,min,max);
    if (acceptFirst&&density===nearest) return cells;
    const error=Math.abs(Math.log(density/nearest));
    const score=acceptFirst ? error : error+rng()*.035;
    if (score<bestScore) {best=cells;bestScore=score;}
    if (!acceptFirst&&score<.06&&attempt>=4) break;
  }
  return best || walk(area,span,rng,material,growth?.branchRate,growth?.straightness);
}

function enemyGroups(round,random,area,largestEnemyBonus) {
  const min=round<=8?2:round<=15?3:4;
  const max=round<=4?2:round<=8?3:round<=12?4:round<=16?5:6;
  const count=rangeInt(min,max,random('enemyCount'));
  const rng=random('enemyWeights');
  const weights=Array.from({length:count},(_,i)=>.72+rng()*.8+(i===0 && rng()<.72 ? largestEnemyBonus : 0));
  const sum=weights.reduce((a,b)=>a+b,0);
  const groups=weights.map(weight=>3+Math.floor((area-count*3)*weight/sum));
  const remainderRng=random('enemyRemainder');
  for (let remaining=area-groups.reduce((sum,size)=>sum+size,0);remaining>0;remaining--) {
    groups[rangeInt(0,count-1,remainderRng)]++;
  }
  return groups.sort((a,b)=>b-a);
}

function potionCell(piece, x, y) {
  const id=key(x,y);
  return {x,y,source:id,mark:piece.marks?.[id],double:piece.double?.has(id) ?? false,
    pickup:piece.pickups?.get(id)};
}

function potionCoordinates(records) {
  if (!records.length) return {cells:[],marks:{},double:new Set(),sources:new Map(),pickups:new Map(),dx:0,dy:0};
  const dx=Math.min(...records.map(cell=>cell.x));
  const dy=Math.min(...records.map(cell=>cell.y));
  const cells=records.map(({x,y})=>[x-dx,y-dy]);
  cells.sort(([ax,ay],[bx,by])=>ay-by||ax-bx);
  const marks={};
  const double=new Set();
  const sources=new Map();
  const pickups=new Map();
  for (const cell of records) {
    const id=key(cell.x-dx,cell.y-dy);
    if (cell.mark) marks[id]=cell.mark;
    if (cell.double) double.add(id);
    if (cell.source!==undefined) sources.set(id,cell.source);
    if (cell.pickup) pickups.set(id,cell.pickup);
  }
  return {cells,marks,double,sources,pickups,dx,dy};
}

function potionSolidify(cells, strong) {
  const left=Math.min(...cells.map(cell=>cell.x));
  const right=Math.max(...cells.map(cell=>cell.x));
  const top=Math.min(...cells.map(cell=>cell.y));
  const bottom=Math.max(...cells.map(cell=>cell.y));
  const occupied=new Set(cells.map(({x,y})=>key(x,y)));
  const outside=new Set();
  const rows=new Map();
  const columns=new Map();
  if (strong) {
    for (const {x,y} of cells) {
      const row=rows.get(y)??[x,x];
      const column=columns.get(x)??[y,y];
      rows.set(y,[Math.min(row[0],x),Math.max(row[1],x)]);
      columns.set(x,[Math.min(column[0],y),Math.max(column[1],y)]);
    }
  } else {
    // Flood from a one-cell margin so open notches stay open.
    const queue=[[left-1,top-1]];
    outside.add(key(...queue[0]));
    for (let i=0;i<queue.length;i++) {
      const [x,y]=queue[i];
      for (const [dx,dy] of CARDINAL) {
        const xx=x+dx, yy=y+dy, id=key(xx,yy);
        if (xx<left-1||xx>right+1||yy<top-1||yy>bottom+1||occupied.has(id)||outside.has(id)) continue;
        queue.push([xx,yy]);
        outside.add(id);
      }
    }
  }
  const result=[...cells];
  for (let y=top;y<=bottom;y++) for (let x=left;x<=right;x++) {
    const id=key(x,y);
    if (occupied.has(id)) continue;
    if (strong) {
      const row=rows.get(y), column=columns.get(x);
      const between=(row&&x>row[0]&&x<row[1])||(column&&y>column[0]&&y<column[1]);
      if (between) result.push({x,y});
    } else if (!outside.has(id)) {
      result.push({x,y});
    }
  }
  return result;
}

function potionLife(cells, original) {
  const neighborCounts=new Map();
  for (const {x,y} of cells) for (const [dx,dy] of STEPS) {
    const xx=x+dx, yy=y+dy, id=key(xx,yy);
    const neighbor=neighborCounts.get(id);
    if (neighbor) neighbor.count++;
    else neighborCounts.set(id,{x:xx,y:yy,count:1});
  }
  const result=[];
  for (const [id,{x,y,count}] of neighborCounts) {
    const existing=original.get(id);
    if (count===3||(count===2&&existing)) result.push(existing??{x,y});
  }
  return result;
}

function potionAlign(cells, side) {
  const horizontal=side==='left'||side==='right';
  const reverse=side==='right'||side==='bottom';
  const fixed=horizontal?'y':'x', moving=horizontal?'x':'y';
  const values=cells.map(cell=>cell[moving]);
  const border=reverse?Math.max(...values):Math.min(...values);
  const lines=new Map();
  for (const cell of cells) {
    if (!lines.has(cell[fixed])) lines.set(cell[fixed],[]);
    lines.get(cell[fixed]).push(cell);
  }
  const result=[];
  for (const line of lines.values()) {
    line.sort((a,b)=>a[moving]-b[moving]);
    const start=reverse?border-line.length+1:border;
    line.forEach((cell,index)=>result.push({...cell,[moving]:start+index}));
  }
  return result;
}

function potionShape(id, piece, option={},offset) {
  if (!piece?.cells.length) return null;
  const {x:offsetX,y:offsetY}=offset??pieceSlotOffset(piece,piece.home);
  const frame={x:-offsetX,y:-offsetY};
  const cells=piece.cells.map(([x,y])=>potionCell(piece,x,y));
  const original=new Map(cells.map(cell=>[key(cell.x,cell.y),cell]));
  let result;
  switch (id) {
    case 'cut': {
      const {axis,line,before}=option;
      if (!['x','y'].includes(axis)||!Number.isInteger(line)) return null;
      result=cells.filter(cell=>(cell[axis]<line)===before);
      break;
    }
    case 'shift': {
      const {dx,dy}=option;
      if (!Number.isInteger(dx)||!Number.isInteger(dy)||Math.abs(dx)>1||Math.abs(dy)>1||(!dx&&!dy)) return null;
      const union=new Map(original);
      for (const cell of cells) {
        const x=cell.x+dx,y=cell.y+dy,id=key(x,y);
        if (inSlotFrame(frame,x,y)&&!union.has(id)) union.set(id,{x,y});
      }
      result=[...union.values()];
      break;
    }
    case 'solidify':
    case 'strong':
      result=potionSolidify(cells,id==='strong');
      break;
    case 'life':
      result=potionLife(cells,original).filter(({x,y})=>inSlotFrame(frame,x,y));
      break;
    case 'difference': {
      const differences=new Map();
      for (const a of cells) for (const b of cells) {
        const x=a.x-b.x,y=a.y-b.y;
        if (x<0||y<0) continue;
        const id=key(x,y);
        differences.set(id,original.get(id)??{x,y});
      }
      result=[...differences.values()];
      break;
    }
    case 'align':
      if (!['left','right','top','bottom'].includes(option.side)) return null;
      result=potionAlign(cells,option.side);
      break;
    case 'turn': {
      const {turns=0,mirror=false}=option;
      if (!Number.isInteger(turns)) return null;
      const quarters=((turns%4)+4)%4;
      const last=MAX_PIECE_SPAN-1;
      result=cells.map(cell=>{
        let x=cell.x-frame.x, y=cell.y-frame.y;
        if (mirror) x=last-x;
        for (let i=0;i<quarters;i++) [x,y]=[last-y,x];
        return {...cell,x:x+frame.x,y:y+frame.y};
      });
      return potionCoordinates(result);
    }
    default:
      return null;
  }
  if (!result.length) return id==='life'&&piece.kind==='enemy'?potionCoordinates(result):null;
  const unchanged=result.length===cells.length&&result.every(cell=>{
    const prior=original.get(key(cell.x,cell.y));
    return prior&&prior.mark===cell.mark&&prior.pickup===cell.pickup&&Boolean(prior.double)===Boolean(cell.double);
  });
  return unchanged?null:potionCoordinates(result);

    for (const [id,cell] of first) if (!second.has(id)) cells.push(cell);

function potionCardMap(pieces) {
  const coverage=new Map();
  for (const piece of pieces) {
    if (piece.kind!=='card'||piece.inactive||piece.banned||piece.free) continue;
    for (const [x,y] of piece.cells) {
      const xx=x+piece.x,yy=y+piece.y;
      if (!inDefense(xx,yy)) continue;
      const id=key(xx,yy);
      if (!coverage.has(id)) coverage.set(id,[]);
      coverage.get(id).push({piece,xx,yy});
    }
  }
  return coverage;
}

function potionSurround(pieces) {
  const coverage=potionCardMap(pieces);
  const visited=new Set();
  const result=[];
  for (let y=FIELD.y;y<FIELD.y+FIELD.size;y++) for (let x=FIELD.x;x<FIELD.x+FIELD.size;x++) {
    const start=key(x,y);
    if (visited.has(start)||coverage.has(start)) continue;
    const queue=[[x,y]];
    const borderCards=new Set();
    visited.add(start);
    let open=false;
    for (let i=0;i<queue.length;i++) {
      const [cx,cy]=queue[i];
      for (const [dx,dy] of CARDINAL) {
        const xx=cx+dx,yy=cy+dy;
        if (!inDefense(xx,yy)) {
          open=true;
          continue;
        }
        const id=key(xx,yy);
        const edge=coverage.get(id);
        if (edge) {
          for (const {piece} of edge) borderCards.add(piece.id);
        } else if (!visited.has(id)) {
          queue.push([xx,yy]);
          visited.add(id);
        }
      }
    }
    if (!open&&borderCards.size>=2) result.push(...queue);
  }
  return result;
}

function potionSharedEdges(pieces) {
  const coverage=potionCardMap(pieces);
  const result=[];
  for (const owners of coverage.values()) {
    const {xx,yy}=owners[0];
    // Each board edge is tested once and must be an outside side of both pieces.
    for (const [dx,dy] of [[1,0],[0,1]]) {
      const adjacent=coverage.get(key(xx+dx,yy+dy));
      if (!adjacent) continue;
      const endsHere=owners.some(({piece})=>!adjacent.some(owner=>owner.piece.id===piece.id));
      const endsThere=adjacent.some(({piece})=>!owners.some(owner=>owner.piece.id===piece.id));
      if (endsHere&&endsThere) result.push([xx,yy,dx,dy]);
    }
  }
  return result;
}

  if (id==='nextEnemy') return option==='send' ? planSendEnemy(first) : planNextEnemy(first);

function equipDirection(dx,dy,label,action,options) {
  const button=equipButton(label,action,options);
  const glyph=document.createElement('canvas');
  glyph.className='equip-arrow';
  glyph.width=glyph.height=11;
  glyph.setAttribute('aria-hidden','true');
  const paint=glyph.getContext('2d');
  paint.fillStyle='#303030';
  const diagonal=Boolean(dx&&dy);
  const angle=Math.atan2(dy,dx)-(diagonal ? Math.PI/4 : 0);
  const turns=(Math.round(angle/(Math.PI/2))+4)%4;
  for (let y=0;y<11;y++) for (let x=0;x<11;x++) {
    const ink=diagonal
      ? (Math.abs(x-y)<=1||(x>=9&&y>=5)||(y>=9&&x>=5))
      : (x>=5&&x<=10-Math.abs(y-5))||(x<5&&y>=4&&y<=6);
    if (!ink) continue;
    let u=x,v=y;
    for (let turn=0;turn<turns;turn++) [u,v]=[10-v,u];
    paint.fillRect(u,v,1,1);
  }
  button.replaceChildren(glyph);
  return button;
}

function paintPotionIcon(icon) {
  const canvas=icon.firstElementChild;

  const pixels=Number(canvas.dataset.pixels);
  const inset=Math.floor((canvas.width-pixels)/2);
  const paint=canvas.getContext('2d');
  const drawing=POTION_DRAWINGS[icon.dataset.potion];
  if (drawing) {
    paint.clearRect(0,0,canvas.width,canvas.height);
    const edge=value=>Math.round(value*pixels/POTION_ICON_SIDE);
    for (const [x,y,w,h,color='#303030'] of drawing) {
      paint.fillStyle=color;
      const left=edge(x), top=edge(y);
      paint.fillRect(inset+left,inset+top,edge(x+w)-left,edge(y+h)-top);
    }
    return;
  }
  const source=potionSources.get(icon.dataset.potion);
  if (!source?.naturalWidth) return;
  paint.imageSmoothingEnabled=false;
  paint.drawImage(source,inset,inset,pixels,pixels);

function snapPotionIcons(group) {
  const ratio=pixelRatio;
  const positions=Array.from(group.querySelectorAll('.potion-art'),icon=>{
    const pixels=Math.round(Number(icon.dataset.pixels)*gameZoom);
    const minimum=Math.ceil(pixels/ratio);
    // Pad the canvas so its CSS size and backing size both land on whole pixels.
    let side=minimum;
    for (let candidate=minimum;candidate<minimum+12;candidate++) {
      if (Math.abs(candidate*ratio-Math.round(candidate*ratio))<1e-4) {
        side=candidate;
        break;
      }
    }
    const backing=Math.round(side*ratio);
    side=backing/ratio;
    const {left,top,width,height}=gameRect(icon);
    const x=left+(width-side)/2, y=top+(height-side)/2;
    return {icon,pixels,side,backing,left:Math.round(x*ratio)/ratio-left,top:Math.round(y*ratio)/ratio-top};
  });
  for (const {icon,pixels,side,backing,left,top} of positions) {
    const canvas=icon.firstElementChild;
    canvas.style.width=canvas.style.height=side+'px';
    canvas.style.left=left+'px';
    canvas.style.top=top+'px';
    if (canvas.width!==backing||Number(canvas.dataset.pixels)!==pixels) {
      canvas.width=canvas.height=backing;
      canvas.dataset.pixels=pixels;
      paintPotionIcon(icon);
    }
  }
}

const ENEMY_PRIORITY = {seal:0, hole:1, heavy:2, persist:3, normal:4, gray:5};
const ENEMY_EFFECTS = [
  [], [], [], ['gray'], [], ['heavy'],
  ['gray'], ['seal','heavy'], ['heavy'],
  ['hole','gray'], ['seal'], ['persist','heavy'],
  ['seal','hole','gray'], ['persist','heavy'],
  ['seal','heavy'], ['hole','persist','gray'],

const HOLLOW_START_ROUND = 3;
const HOLLOW_SHARE = .10;
const STANDARD_ENEMY_OPEN_SEAM_CHANCE = .09;
const ENEMY_OPEN_SEAM_CHANCE = .18;

const solidEnemyCell=(piece,id)=>(piece.marks?.[id]??'normal')==='normal';

function rollEnemySeams(piece,state,{round=state.round,preview=false,potionSerial}={}) {
  const purpose=potionSerial!==undefined?'mergedEnemySeams':preview?'previewSeams':'enemySeams';
  const rng=generator(state.seed,round,purpose,potionSerial??piece.slot);
  const chance=state.gameMode==='standard'?STANDARD_ENEMY_OPEN_SEAM_CHANCE:ENEMY_OPEN_SEAM_CHANCE;
  const occupied=new Set(piece.cells.map(cell=>key(...cell)).filter(id=>preview||solidEnemyCell(piece,id)));
  const seams=[];
  for (const [x,y] of piece.cells) {
    if (!occupied.has(key(x,y))) continue;
    for (const [dx,dy] of [[1,0],[0,1]]) {
      if (occupied.has(key(x+dx,y+dy))&&rng()<chance) seams.push([x,y,dx,dy]);
    }
  }
  return seams;
}

function enemyOpenSeams(piece,state,round=state.round) {
  if (piece.swapped&&!piece.free&&piece.openSeams?.length!==0) piece.openSeams=[];
  return piece.openSeams??=rollEnemySeams(piece,state,{round});
}

function transformedEnemySeams(seams,sources) {
  const bySource=new Map();
  for (const [target,source] of sources) bySource.set(source,target.split(',').map(Number));
  const result=[];
  for (const [x,y,dx,dy] of seams) {
    const a=bySource.get(key(x,y)), b=bySource.get(key(x+dx,y+dy));
    if (!a||!b) continue;
    const width=Math.abs(a[0]-b[0]),height=Math.abs(a[1]-b[1]);
    if (width+height===1) result.push([Math.min(a[0],b[0]),Math.min(a[1],b[1]),width,height]);
  }
  return result;
}

const enemyGeometryCache=new WeakMap();
function enemyGeometry(piece,state,round=state.round) {
  const seams=enemyOpenSeams(piece,state,round);
  const cached=enemyGeometryCache.get(seams);
  if (cached?.shape===piece.cells&&cached.marks===piece.marks&&cached.pickups===piece.pickups) return cached.cells;
  const byCell=new Map();
  for (const [x,y] of piece.cells) {
    const id=key(x,y);
    const type=pieceCellType(piece,id);
    if (type!=='pickup') byCell.set(id,{x,y,id,type,joined:null});
  }
  for (const [x,y,dx,dy] of seams) {
    const a=byCell.get(key(x,y)), b=byCell.get(key(x+dx,y+dy));
    if (a?.type!=='normal'||b?.type!=='normal') continue;
    const first=a.joined, second=b.joined;
    if (first&&first===second) continue;
    const group=first??second??new Set();
    group.add(a.id).add(b.id);
    if (first&&second) for (const id of second) group.add(id);
    for (const id of group) byCell.get(id).joined=group;
  }
  const cells=[...byCell.values()];
  for (const cell of cells) {
    const {x,y,joined}=cell;
    if (!joined) continue;
    const left=joined.has(key(x-1,y)), top=joined.has(key(x,y-1));
    const right=joined.has(key(x+1,y)), bottom=joined.has(key(x,y+1));
    cell.joinedFill={
      left,top,right,bottom,
      cutTopLeft:left&&top&&!joined.has(key(x-1,y-1)),
      cutTopRight:right&&top&&!joined.has(key(x+1,y-1)),
      cutBottomLeft:left&&bottom&&!joined.has(key(x-1,y+1)),
      cutBottomRight:right&&bottom&&!joined.has(key(x+1,y+1))
    };
  }
  enemyGeometryCache.set(seams,{shape:piece.cells,marks:piece.marks,pickups:piece.pickups,cells});
  return cells;
}

let baseEnemyCache;
function baseEnemiesFor(state) {
  const {seed,gameMode}=state;
  if (!baseEnemyCache||baseEnemyCache.seed!==seed||baseEnemyCache.gameMode!==gameMode) {
    baseEnemyCache={seed,gameMode,
      hollowBias:2*generator(seed,0,'enemyHollowBias')()-1,
      largestEnemyBonus:.2+1.2*generator(seed,0,'enemySizeBias')(),
      straightnessBias:generator(seed,0,'enemyStraightness')(),
      rounds:Array(ROUNDS).fill(null),work:[],warming:false};
  }
  return baseEnemyCache;
}

function enemyCards(state,round=state.round) {
  const cache=baseEnemiesFor(state), index=round-1;
  if (!cache.rounds[index]) {
    cache.rounds[index]=finishGeneration(cache.work[index]??generateEnemyCards(cache,round));
    delete cache.work[index];
  }
  return cache.rounds[index];
}

function prepareBaseEnemies(state) {
  const cache=baseEnemiesFor(state);
  if (cache.warming||cache.rounds.every(Boolean)) return;
  cache.warming=true;
  const first=state.round%ROUNDS;
  let checked=0;
  const warm=deadline=>{
    if (cache!==baseEnemyCache) return;
    const end=performance.now()+4;
    while (!boardBusy()&&checked<ROUNDS&&performance.now()<end&&(deadline?.timeRemaining()??4)>1) {
      const index=(first+checked)%ROUNDS;
      if (!cache.rounds[index]) {
        const work=cache.work[index]??=generateEnemyCards(cache,index+1);
        const result=work.next();
        if (!result.done) continue;
        cache.rounds[index]=result.value;
        delete cache.work[index];
      }
      checked++;
    }
    if (checked<ROUNDS) queueBackgroundWork(warm);
    else cache.warming=false;
  };
  queueBackgroundWork(warm);
}

function enemyDensityRange(round) {
  const index=ENEMY_DENSITY_CURVE.findIndex(point=>point.round>=round);
  const end=ENEMY_DENSITY_CURVE[index];
  const start=ENEMY_DENSITY_CURVE[index-1];
  if (!start) return end;
  const progress=(round-start.round)/(end.round-start.round);
  const interpolate=(low,high)=>low+(high-low)*progress;
  return {min:interpolate(start.min,end.min),max:interpolate(start.max,end.max)};
}

function enemyGrowthStyle(seed,round) {
  // Each successive round replaces one sample in the window.
  const average=(index,sampleCount)=>{
    let sum=0;
    for (let sample=round;sample<round+sampleCount;sample++) {
      sum+=generator(seed,sample,'enemyGrowth',index)();
    }
    return sum/sampleCount;
  };
  return {branch:average(0,10),straight:average(1,5)};
}

function* generateEnemyCards(run,round) {
  const random=(purpose,index)=>generator(run.seed,round,purpose,index);
  const effects=ADVANCED_ENEMY_CELLS ? ENEMY_EFFECTS[round-1]??[] : [];
  const demand=run.gameMode==='standard' ? STANDARD_DEMAND : ADVANCED_DEMAND;
  const target=demand[round-1];
  const spread=Math.max(1,Math.round(.055*target));
  const area=round===1 ? target : rangeInt(target-spread,target+spread,random('enemyArea'));
  const heavy=effects.filter(effect=>effect==='heavy').length;
  // Hollow markings convert existing cells. Only heavy cells add a damage point.
  const reserve=ADVANCED_ENEMY_CELLS ? round>=16 ? 4 : round>=8 ? 2 : 0 : 0;
  const span=Math.min(MAX_PIECE_SPAN,Math.round((round+4)*.8));
  const densityRange=enemyDensityRange(round);
  const style=enemyGrowthStyle(run.seed,round);
  const enemies=[];
  for (const [index,size] of enemyGroups(round,random,area-heavy-reserve,run.largestEnemyBonus).entries()) {
    const split=round>5&&random('enemySplit',index)()<.3;
    const variation=random('enemyGrowthVariation',index);
    const growth={branchRate:.08+.36*(.6*style.branch+.4*variation()),
      straightness:3+9*(.2*run.straightnessBias+.4*style.straight+.4*variation())};
    const cells=yield* rollShapeSteps(size,span,densityRange,random('enemyShape',index),split,false,20,growth);
    enemies.push({id:'e'+index,slot:index,cells,marks:{}});
    yield;
  }
  const markRng=random('enemyMarks');
  const solidSlots=enemies.flatMap(enemy=>enemy.cells.map(cell=>({enemy,cell})));
  const total=solidSlots.length;
  for (const effect of effects) {
    const [{enemy,cell}]=solidSlots.splice(rangeInt(0,solidSlots.length-1,markRng),1);
    enemy.marks[key(...cell)]=effect;
  }
  if (round>=HOLLOW_START_ROUND) {
    const hollowRng=random('enemyHollows');
    const count=Math.min(solidSlots.length,Math.round(total*HOLLOW_SHARE));
    const pools=enemies.map(enemy=>({enemy,cells:[],hollows:0,weight:0}));
    for (const {enemy,cell} of solidSlots) {
      const pool=pools[enemy.slot];
      pool.cells.push(cell);
      pool.weight++;
    }
    for (let index=0;index<count;index++) {
      const pool=weighted(pools,hollowRng);
      const [cell]=pool.cells.splice(rangeInt(0,pool.cells.length-1,hollowRng),1);
      pool.enemy.marks[key(...cell)]='hollow';
      pool.hollows++;
      pool.weight=pool.cells.length*(1+pool.hollows)**run.hollowBias;
    }
  }
  for (const enemy of enemies) enemyOpenSeams(enemy,run,round);
  return enemies;
}

function randomFragment(size,rng) {
  const positions=Array.from({length:size*size},(_,index)=>index);
  const cells=Array.from({length:size},()=>{
    const [position]=positions.splice(rangeInt(0,positions.length-1,rng),1);
    return [position%size,Math.floor(position/size)];
  });
  return normalize(cells);
}

function rewards(run,carry=0,gray=0) {
  const {round,seed}=run;
  const area=fragmentArea(round,run.gameMode);
  const fragments=Array.from({length:5+Math.floor((round-1)/4)},(_,index)=>
    randomFragment(area,generator(seed,round,'fragment',index)));
  const enemies=run.nextEnemies??structuredClone(nextEncounter(run));
  if (carry) {
    const slot=enemies.length;
    const cells=Array.from({length:carry},(_,index)=>[index,0]);
    enemies.push({id:'e'+slot,slot,cells,marks:{}});
  }
  delete run.nextEnemies;
  return {fragments,placements:[],enemies,gray};
}

function slotOrigin(slot,isEnemy,offset=0) {
  const column=slot%2, row=Math.floor(slot/2);
  const columnOffset=trayInset+column*MAX_PIECE_SPAN;
  return {
    x:isEnemy ? FIELD.x+FIELD.size+columnOffset : FIELD.x-MAX_PIECE_SPAN-columnOffset,
    y:SLOT_TOP+row*MAX_PIECE_SPAN+offset
  };
}
function slotPosition(piece,isEnemy,offset=0) {
  const origin=slotOrigin(piece.slot,isEnemy,offset);
  const saved=piece.slotOffset;
  if (saved?.x!=null&&saved.y!=null) return {x:origin.x+saved.x,y:origin.y+saved.y};
  const {w,h}=bounds(piece.layoutCells||piece.cells);
  const inset=(MAX_PIECE_SPAN-w)/2;
  return {
    x:origin.x+(saved?.x ?? (isEnemy ? Math.ceil(inset) : Math.floor(inset))),
    y:origin.y+(saved?.y ?? Math.floor((MAX_PIECE_SPAN-h)/2))
  };
}
function makeTray(cards,kind,offset=0) {
  return cards.map(card=>{
    const home=slotPosition(card,kind==='enemy',offset);
    return {...card,kind,...home,home};
  });
}

function battleCards(run) {
  return makeTray(run.cards,'card').map(piece=>{
    const eaten=run.eatenNext?.get(piece.id);
    const cells=eaten ? piece.cells.filter(cell=>!eaten.has(key(...cell))) : piece.cells;
    return {
      ...piece, cells:cells.length ? cells : piece.cells,
      layoutCells:eaten ? piece.cells : undefined,
      banned:run.sealNext?.has(piece.id)||!cells.length
    };
  });
}

function startBattle(run,enemies=structuredClone(enemyCards(run))) {
  run.phase='battle';
  run.reward=null;
  delete run.nextEnemies;
  delete run.nextEnemySwaps;
  delete run.nextEnemyUsed;
  delete run.nextEnemyPulls;
  delete run.damageHalvings;
  run.temporarilyChangedCards=new Set();
  run.pieces=[...battleCards(run),...makeTray(enemies,'enemy')];
  run.sealNext=new Set();
  run.eatenNext=new Map();
  run.retainedEdges=run.keepEdges??[];
  run.keepEdges=[];
  run.edgeRetentionActive=false;
  run.bonusCells=[];
  run.cast=null;
  run.scouted=run.scoutedRounds.has(run.round+1);
  if (run.gameMode==='experiment') {
    // Leave enough life to try effects that carry into the next battle.
    run.hp=HP+enemies.reduce((total,enemy)=>total+enemy.cells.length,0);
  }
  const drops=rollPotions(run);
  if (!drops.length) return;
  const carriers=run.pieces.filter(piece=>piece.kind==='enemy').map(piece=>{
    if (piece.pickups) piece.pickups=new Map(piece.pickups);
    const silhouette=new Set(potionSolidify(piece.cells.map(([x,y])=>({x,y})),false).map(({x,y})=>key(x,y)));
    const cells=piece.cells.filter(([x,y])=>piece.marks?.[key(x,y)]!=='hollow'&&!piece.pickups?.has(key(x,y))&&
      CARDINAL.some(([dx,dy])=>!silhouette.has(key(x+dx,y+dy))));
    return {piece,cells};
  }).filter(carrier=>carrier.cells.length);
  for (const [index,type] of drops.entries()) {
    if (!carriers.length) break;
    const carrierRng=generator(run.seed,run.round,'potionCarrier',index);
    const carrierIndex=rangeInt(0,carriers.length-1,carrierRng);
    const carrier=carriers[carrierIndex];
    const rng=carrier.rng??=generator(run.seed,run.round,'potionCells',carrier.piece.slot);
    const [cell]=carrier.cells.splice(rangeInt(0,carrier.cells.length-1,rng),1);
    carrier.piece.pickups??=new Map();
    carrier.piece.pickups.set(key(...cell),type);
    if (!carrier.cells.length) carriers.splice(carrierIndex,1);
  }
}

function testCardShapes(seed) {
  const patterns=[
    ['..#######..','.########..','.##.....#..','.##.....###','.##.....###','..#######..','..#######..'],
    ['##.......##','##.......##','##.......##','##.......##','##.......##','###########','###########'],
    ['....###....','....####...','###########','###########','..###......','..###......']
  ];
  const shapes=patterns.map(rows=>normalize(rows.flatMap((row,y)=>
    [...row].flatMap((cell,x)=>cell==='#'?[[x,y]]:[]))));
  shapes.push(...Array.from({length:2},(_,index)=>
    rolledShape(EXPERIMENT_MAX_CARD_AREA,11,.45,generator(seed,EXPERIMENT_START_ROUND,'experimentTile',index),false,true)));
  return shapes;
}

const GAME_MODES=['standard','advanced','experiment'];
const SEED_HISTORY_KEY='inhold.seedHistory';
const SEED_HISTORY_LIMIT=10;
let recentSeeds;

function loadSeedHistory(saved) {
  try {
    saved??=readSavedValue(SEED_HISTORY_KEY);
    const entries=Array.isArray(saved)?saved:saved?.entries;
    if (!Array.isArray(entries)) return {entries:[]};
    const distinct=new Map();
    for (const entry of entries) {
      const seed=entry?.seed;
      if (!Number.isInteger(seed)||seed!==(seed>>>0)||distinct.has(seed)) continue;
      distinct.set(seed,{seed,favorite:entry.favorite===true});
      if (distinct.size===SEED_HISTORY_LIMIT) break;
    }
    const history=[...distinct.values()];
    const seed=saved?.currentSeed;
    const currentSeed=Number.isInteger(seed)&&seed===(seed>>>0)?seed:history[0]?.seed;
    return {currentSeed,entries:history};
  } catch {
    return {entries:[]};
  }
}

function saveSeedHistory(history) {
  recentSeeds=history;
  saveMetadata(SEED_HISTORY_KEY,history);
}

function rememberSeed(seed) {
  const {entries}=recentSeeds;
  const played=entries.find(entry=>entry.seed===seed)??{seed,favorite:false};
  const recent=[played,...entries.filter(entry=>entry!==played)];
  if (recent.length>SEED_HISTORY_LIMIT) {
    const oldest=recent.findLastIndex(entry=>!entry.favorite);
    recent.splice(oldest,1);
  }
  saveSeedHistory({currentSeed:seed,entries:recent});
}

function setSeedFavorite(seed,favorite) {
  const history=recentSeeds;
  const entry=history.entries.find(entry=>entry.seed===seed);
  if (!entry) return false;
  entry.favorite=favorite;
  saveSeedHistory(history);
  return true;
}

function newRun(seed,gameMode='standard') {
  const experiment=gameMode==='experiment';
  seed??=seedValue();
  const shapes=experiment ? testCardShapes(seed) : Array.from({length:3},(_,index)=>
    walk(START_CARD_AREA,3,generator(seed,1,'startingTile',index),true));
  const cards=shapes.map((cells,slot)=>({id:'p'+slot,slot,cells}));
  const run={seed,gameMode,round:experiment?EXPERIMENT_START_ROUND:1,hp:HP,phase:'battle',reward:null,cards,
    potions:experiment?Object.keys(POTIONS).flatMap(id=>Array(MAX_POTION_STACK-1).fill(id)):[],scoutedRounds:new Set()};
  startBattle(run);
  return run;
}

function active(piece) {
  return !piece.inactive&&!piece.banned&&piece.cells.some(([x,y])=>inDefense(piece.x+x,piece.y+y));
}
function deployment(run) {
  const deployed=new Set();
  for (const piece of run.pieces) {
    if (piece.kind==='card'&&!piece.free&&active(piece)) deployed.add(piece.sourceId??piece.id);
  }
  const count=deployed.size;
  const limit=deployLimit(run.round);
  return {deployed,count,limit,overLimit:count>limit};
}

function shieldDepth(covers,bonus) {
  let depth=bonus?1:0;
  for (const cover of covers??[]) depth=Math.max(depth,cover.depth);
  return depth;
}

function clearJoinedGroups(groups,coverings,stacks,bonus) {
  const cleared=new Set(), space=new Map();
  // A joined group needs one available shield layer in every cell.
  for (const [group,{cells}] of groups) {
    const first=coverings.get(cells[0]);
    if (!first?.some(({piece})=>cells.every(id=>coverings.get(id)?.some(cover=>cover.piece===piece)))) continue;
    if (!cells.every(id=>{
      if (!space.has(id)) {
        const priority=stacks.get(id).filter(layer=>ENEMY_PRIORITY[layer.type]<ENEMY_PRIORITY.normal).length;
        space.set(id,shieldDepth(coverings.get(id),bonus.has(id))-priority);
      }
      return space.get(id)>0;
    })) continue;
    cleared.add(group);
    for (const id of cells) space.set(id,space.get(id)-1);
  }
  return cleared;
}

const enemyPlacementCache=new WeakMap();
let cachedEnemyLayout;
function enemyPlacement(piece,state) {
  const shape=enemyGeometry(piece,state), cached=enemyPlacementCache.get(piece);
  if (cached?.shape===shape&&cached.x===piece.x&&cached.y===piece.y) return cached;
  const cells=shape.map(({x,y,type,joined,joinedFill})=>{
    const xx=x+piece.x, yy=y+piece.y;
    return {piece,x:xx,y:yy,id:key(xx,yy),type,joined,joinedFill};
  });
  const placed={piece,shape,x:piece.x,y:piece.y,cells};
  enemyPlacementCache.set(piece,placed);
  return placed;
}

function enemyLayout(run) {
  const placed=run.pieces.filter(piece=>piece.kind==='enemy'&&!piece.inactive&&!piece.banned)
    .map(piece=>enemyPlacement(piece,run));
  const cached=cachedEnemyLayout;
  if (cached?.placed.length===placed.length&&placed.every((entry,i)=>entry===cached.placed[i])) return cached;
  const stacks=new Map(), hollowOwners=new Map(), joinedGroups=new Map();
  const overlapped=new Set(), singleEnemyAt=new Map();
  for (const {piece,cells} of placed) for (const cell of cells) {
    const {id,type,joined}=cell, kinds=type==='hollow'?hollowOwners:stacks;
    const layers=kinds.get(id)??[];
    layers.push(cell);
    kinds.set(id,layers);
    if (joined) {
      if (!joinedGroups.has(joined)) joinedGroups.set(joined,{slot:piece.slot,cells:[]});
      joinedGroups.get(joined).cells.push(id);
    }
  }
  for (const [id,owners] of hollowOwners) {
    const stack=stacks.get(id);
    if (!stack) continue;
    // A group of coincident hollows adds exactly one ordinary layer.
    stack.push({piece:owners[0].piece,type:'normal',hollowOwners:owners});
    hollowOwners.delete(id);
  }
  for (const [id,layers] of stacks) {
    if (layers.length===1) {
      singleEnemyAt.set(id,layers[0].piece);
      continue;
    }
    layers.sort((a,b)=>ENEMY_PRIORITY[a.type]-ENEMY_PRIORITY[b.type]||
      Number(Boolean(b.joined))-Number(Boolean(a.joined))||
      Number(Boolean(a.hollowOwners))-Number(Boolean(b.hollowOwners))||a.piece.slot-b.piece.slot);
    for (const layer of layers) {
      overlapped.add(layer.piece);
      for (const owner of layer.hollowOwners??[]) overlapped.add(owner.piece);
    }
  }
  for (const [id,owners] of hollowOwners) {
    if (owners.length===1) singleEnemyAt.set(id,owners[0].piece);
    else for (const {piece} of owners) overlapped.add(piece);
  }
  const groups=[...joinedGroups].sort(([,a],[,b])=>a.slot-b.slot);
  return cachedEnemyLayout={placed,stacks,hollowOwners,joinedGroups:groups,overlapped,singleEnemyAt};
}

function settlement(run,preview=false,previewEnemies=[]) {
  const {placed,stacks,hollowOwners,joinedGroups,overlapped,singleEnemyAt}=enemyLayout(run);
  const coverings=new Map(), styledEnemies=new Set(overlapped);
  const pickups=[];
  const pickupCarriers=previewEnemies.length
    ? placed.concat(previewEnemies.map(piece=>({piece})))
    : placed;
  for (const {piece} of pickupCarriers) {
    if (!piece.pickups?.size) continue;
    const edited=previewEnemies.includes(piece);
    const cells=cellKeys(piece.cells);
    for (const [cell,type] of piece.pickups) {
      if (!type||!cells.has(cell)) continue;
      const [dx,dy]=cell.split(',').map(Number), x=piece.x+dx, y=piece.y+dy;
      const id=key(x,y);
      if (stacks.has(id)||hollowOwners.has(id)) continue;
      if (previewEnemies.some(other=>other!==piece&&hitSolid(other,x,y)&&
        (edited||pieceCellType(other,key(x-other.x,y-other.y))!=='pickup'))) continue;
      pickups.push({x,y,piece,cell,type});
    }
  }
  for (const piece of run.pieces) {
    if (piece.kind==='enemy'||piece.inactive||piece.banned) continue;
    for (const [x,y] of piece.cells) {
      const xx=x+piece.x, yy=y+piece.y;
      if (!inDefense(xx,yy)) continue;
      const id=key(xx,yy), local=key(x,y), group=coverings.get(id)||[];
      group.push({piece,local,depth:piece.double?.has(local) ? 2 : 1});
      coverings.set(id,group);
    }
  }
  const retained=new Set(retainedEdgeCells(run.retainedEdges).map(([x,y])=>key(x,y)));
  const bonus=new Set(retained);
  for (const [x,y] of run.bonusCells??[]) {
    if (inDefense(x,y)) bonus.add(key(x,y));
  }
  const touchesEdge=(x,y)=>CARDINAL.some(([dx,dy])=>{
    const neighbor=key(x+dx,y+dy);
    return (retained.has(neighbor)&&!retained.has(key(x,y)))||
      coverings.get(neighbor)?.some(({piece})=>!cellKeys(piece.cells).has(key(x-piece.x,y-piece.y)));
  });
  const uncovered=new Map(), absorbed=new Set(), hollows=new Map();
  const remainingTypes=new Map(), resolvedTypes=new Map(), unclean=new Set();
  const visibleJoined=new Map(), partialJoined=new Set();
  const sealed=new Set(), eaten=new Map(), consumed=[];
  let damage=0, carry=0, gray=0;
  for (const [id,owners] of hollowOwners) {
    const {x,y}=owners[0];
    const resolved=touchesEdge(x,y);
    hollows.set(id,resolved);
    if (resolved) {
      for (const {piece} of owners) styledEnemies.add(piece);
    } else {
      damage++;
      if (!preview) for (const {piece} of owners) unclean.add(piece.id);
    }
  }
  const cleared=clearJoinedGroups(joinedGroups,coverings,stacks,bonus);
  for (const [id,layers] of stacks) {
    const count=layers.length;
    const covers=coverings.get(id)||[];
    const hasBonus=bonus.has(id);
    const available=shieldDepth(covers,hasBonus);
    const overlapping=covers.length+Number(hasBonus)>1;
    let used=0, firstCovered, firstUncovered;
    for (const layer of layers) {
      if (available) styledEnemies.add(layer.piece);
      const covered=used<available&&(!layer.joined||cleared.has(layer.joined));
      if (!preview&&(overlapping||!covered)) {
        unclean.add(layer.piece.id);
        if (layer.hollowOwners) for (const {piece} of layer.hollowOwners) unclean.add(piece.id);
      }
      if (covered) {
        firstCovered??=layer;
        used++;
        if (!preview&&layer.type!=='normal') consumed.push({layer,covers});
      } else {
        firstUncovered??=layer;
        damage+=layer.type==='heavy' ? 2 : 1;
        if (layer.type==='persist') carry++;
      }
    }
    if (firstCovered) {
      absorbed.add(id);
      resolvedTypes.set(id,firstCovered.type);
    }
    if (firstUncovered) {
      uncovered.set(id,count-used);
      remainingTypes.set(id,firstUncovered.type);
      if (firstUncovered.joined&&covers.length) partialJoined.add(id);
    }
    const {joinedFill}=firstUncovered??firstCovered;
    if (joinedFill) visibleJoined.set(id,joinedFill);
  }
  for (const {layer,covers} of consumed) {
    const {type,piece}=layer;
    if (type==='gray') {
      gray=1;
      continue;
    }
    if (type!=='seal'&&type!=='hole') continue;
    if (run.round>=SKILL_ROUNDS.exact&&!unclean.has(piece.id)) continue;
    const realCards=covers.filter(cover=>!cover.piece.free);
    const sourceIds=new Set(realCards.map(({piece})=>piece.sourceId??piece.id));
    if (type==='seal'&&run.round>=SKILL_ROUNDS.triple&&sourceIds.size>=3) continue;
    for (const cover of realCards) {
      const sourceId=cover.piece.sourceId??cover.piece.id;
      if (type==='seal') {
        sealed.add(sourceId);
      } else {
        const original=cover.piece.sourceCells ? cover.piece.sourceCells.get(cover.local) : cover.local;
        if (original===undefined) continue;
        const cells=eaten.get(sourceId)||new Set();
        cells.add(original);
        eaten.set(sourceId,cells);
      }
    }
  }
  const stock=pickups.length?potionStock(run.potions):new Map();
  for (const pickup of pickups) {
    const count=stock.get(pickup.type)??0;
    const id=key(pickup.x,pickup.y);
    pickup.collected=count<MAX_POTION_STACK&&
      (coverings.has(id)||retained.has(id)||touchesEdge(pickup.x,pickup.y));
    if (pickup.collected) stock.set(pickup.type,count+1);
  }
  return {
    damage:Math.floor(damage/2**(run.damageHalvings??0)),
    absorbed,uncovered,remainingTypes,resolvedTypes,hollows,visibleJoined,partialJoined,
    shield:preview?null:new Set([...coverings.keys(),...bonus]),
    placed,styledEnemies,singleEnemyAt,
    sealed,eaten,carry,gray,pickups,
    nextEdges:run.edgeRetentionActive?potionSharedEdges(run.pieces):[]
  };
}

function wearDeployedCards(run,eaten) {
  const {deployed}=deployment(run);
  const candidates=run.cards.flatMap(card=>deployed.has(card.id)?card.cells.map(cell=>({card,cell})):[]);
  if (!candidates.length) return;
  const lossCount=run.gameMode==='advanced'&&run.round>=16 ? 2 : 1;
  const count=Math.min(lossCount,candidates.length);
  const rng=generator(run.seed,run.round,'tileWear');
  const removedByCard=new Map();
  for (let i=0;i<count;i++) {
    const [{card,cell}]=candidates.splice(rangeInt(0,candidates.length-1,rng),1);
    const removed=removedByCard.get(card)??new Set();
    removed.add(key(...cell));
    removedByCard.set(card,removed);
  }
  for (const [card,removed] of removedByCard) {
    const cells=card.cells.filter(cell=>!removed.has(key(...cell)));
    const {left,top}=bounds(cells);
    const frame=slotOrigin(card.slot,false), anchor=slotPosition(card,false);
    card.cells=normalize(cells);
    card.slotOffset={x:anchor.x-frame.x+left,y:anchor.y-frame.y+top};
    const disabled=eaten.get(card.id);
    if (disabled) {
      for (const id of removed) disabled.delete(id);
      eaten.set(card.id,shiftedKeys(disabled,left,top));
    }
    if (card.double) {
      const doubled=new Set(card.double);
      for (const id of removed) doubled.delete(id);
      card.double=shiftedKeys(doubled,left,top);
    }
  }
}

function finishBattle(run,result) {
  run.hp=Math.max(0,run.hp-result.damage);
  wearDeployedCards(run,result.eaten);
  for (const {piece,cell,type,collected} of result.pickups) {
    if (!collected||!piece.pickups.delete(cell)) continue;
    piece.cells=piece.cells.filter(([x,y])=>key(x,y)!==cell);
    piece.marks=Object.fromEntries(Object.entries(piece.marks??{}).filter(([id])=>id!==cell));
    if (piece.openSeams) piece.openSeams=piece.openSeams.filter(([x,y,dx,dy])=>
      key(x,y)!==cell&&key(x+dx,y+dy)!==cell);
    if (!piece.cells.length) piece.inactive=true;
    run.potions.push(type);
  }
  if (!run.hp) run.phase='lost';
  else if (run.round===ROUNDS) run.phase='won';
  else {
    run.phase='reward';
    run.sealNext=result.sealed;
    run.eatenNext=result.eaten;
    run.keepEdges=result.nextEdges;
    run.reward=rewards(run,result.carry,result.gray);
    run.pieces=[...makeTray(run.cards,'card'),...run.pieces.filter(piece=>piece.kind==='enemy'&&!piece.inactive)];
  }
}

function shiftedKeys(keys,dx,dy) {
  return new Set([...keys].map(id=>{
    const [x,y]=id.split(',').map(Number);
    return key(x-dx,y-dy);
  }));
}

function growSmallestCard(run,cards) {
  const {seed,round}=run;
  const smallest=Math.min(...cards.map(card=>card.cells.length));
  const card=randomItem(cards.filter(candidate=>candidate.cells.length===smallest),generator(seed,round,'growthTile'));
  const occupied=new Set(card.cells.map(cell=>key(...cell)));
  const {frame,anchor}=cardEditSlot(card);
  const empty=new Map();
  if (!card.cells.length) empty.set(key(0,0),[0,0]);
  for (const [x,y] of card.cells) for (const [dx,dy] of CARDINAL) {
    const u=x+dx, v=y+dy, id=key(u,v);
    if (occupied.has(id)||!inSlotFrame(frame,anchor.x+u,anchor.y+v)) continue;
    empty.set(id,[u,v]);
  }
  if (!empty.size) return;
  const [u,v]=randomItem([...empty.values()],generator(seed,round,'growthCell',card.slot));
  const shiftX=Math.min(0,u), shiftY=Math.min(0,v);
  const eaten=run.eatenNext?.get(card.id);
  if (card.double) card.double=shiftedKeys(card.double,shiftX,shiftY);
  if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,shiftX,shiftY));
  card.cells=normalize([...card.cells,[u,v]]);
  card.slotOffset={x:anchor.x+shiftX-frame.x,y:anchor.y+shiftY-frame.y};
}

const upgradeAllowance=card=>1+(card.savedUpgrades??0);
function* openingGiftChoices(state) {
  const rewardRound=state.round-1;
  let area=GIFT_AREAS[state.gameMode]?.[state.round];
  if (state.gameMode==='experiment') {
    area=EXPERIMENT_MAX_CARD_AREA;
    for (let round=EXPERIMENT_START_ROUND;round<=rewardRound;round++) area+=fragmentArea(round,state.gameMode);
    area+=fragmentArea(rewardRound,state.gameMode);
  }
  const span=giftSpan(state.round);
  const choices=[];
  for (let index=0;index<2;index++) {
    const variation=generator(state.seed,rewardRound,'giftDensity',index)()*.15;
    const target=(index===0 ? .58 : .40)+variation;
    const rng=generator(state.seed,rewardRound,'giftShape',index);
    choices.push(yield* rollShapeSteps(area,span,{target},rng,false,true));
  }
  if (String(choices[0])===String(choices[1])) {
    const width=bounds(choices[0]).w===span ? span-1 : span;
    choices[1]=Array.from({length:area},(_,index)=>[index%width,Math.floor(index/width)]);
  }
  return choices;
}

function nextRound(run) {
  const {enemies,placements,gray}=run.reward;
  const cards=run.cards.map(card=>{
    const patches=placements.filter(placement=>placement.card===card.id);
    const updated={...card,savedUpgrades:upgradeAllowance(card)-patches.length};
    if (!patches.length) return updated;
    const {home}=run.pieces.find(piece=>piece.id===card.id);
    const combined=card.cells.concat(patches.flatMap(({origin,fragmentCells})=>
      fragmentCells.map(([x,y])=>[origin[0]+x-home.x,origin[1]+y-home.y])));
    const {left,top}=bounds(combined);
    const {frame,anchor}=cardEditSlot(card);
    updated.cells=normalize(combined);
    updated.slotOffset={x:anchor.x-frame.x+left,y:anchor.y-frame.y+top};
    const eaten=run.eatenNext?.get(card.id);
    if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,left,top));
    if (card.double) updated.double=shiftedKeys(card.double,left,top);
    return updated;
  });
  if (gray) growSmallestCard(run,cards);
  if (run.round%4===0) run.pendingGift=true;
  run.cards=cards;
  run.round++;
  startBattle(run,enemies);
}

const SAVE_SLOT_COUNT=5, ACTIVE_SAVE_KEY='inhold.activeSlot';
const SEED_RECORDS_KEY='inhold.seedRecords', SEED_RECORD_LIMIT=1000;
const SEED_MILESTONE_ROUND=15;
const SAVE_IDLE_DELAY=600;
const runSaveKey=slot=>'inhold.run.'+slot;
const runProgressKey=slot=>'inhold.progress.'+slot;
const runPositionsKey=slot=>'inhold.positions.'+slot;
const runSummaryKey=slot=>'inhold.summary.'+slot;
const pendingSaves=new Map(), writingSaves=new Map(), saveBases=new Map(), unsavedSlots=new Set();
let activeSaveSlot=0, saveTimer=0, saveTaskQueued=false, saveDb=null, saveUnavailable=false;
const pendingSeedUpdates=[], sessionSeedRecords=[];
let writingSeedRecords=false;

function openSaveDatabase() {
  return new Promise((resolve,reject)=>{
    const name=location.protocol==='file:' ? 'Inhold:'+location.pathname : 'Inhold';
    const request=indexedDB.open(name,1);
    request.onupgradeneeded=()=>request.result.createObjectStore('saves');
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

function saveTransaction(mode,work) {
  return new Promise((resolve,reject)=>{
    const transaction=saveDb.transaction('saves',mode);
    transaction.onabort=()=>reject(transaction.error);
    try {
      const result=work(transaction.objectStore('saves'));
      transaction.oncomplete=()=>resolve(result.map(request=>request.result));
    } catch (error) {
      transaction.abort();
      reject(error);
    }
  });
}

const readSaveValues=keys=>saveTransaction('readonly',store=>keys.map(key=>store.get(key)));
const writeSaveValues=entries=>saveTransaction('readwrite',store=>entries.map(([key,value])=>store.put(value,key)));
function boardBusy() {
  return (locked&&!run.pendingGift)||frameAnimation||drag||upgradeDrag||potionChoice?.overlapDrag||
    potionChoice?.edit?.drag||potionChoice?.cutPointer!==undefined;
}
function queueIdleWork(task) {
  if (typeof requestIdleCallback==='function') requestIdleCallback(task);
  else if (globalThis.scheduler?.postTask) globalThis.scheduler.postTask(()=>task(),{priority:'background'});
  else setTimeout(task);
}
function queueBackgroundWork(task) {
  requestAnimationFrame(()=>queueIdleWork(task));
}
function saveMetadata(key,value) {
  if (saveDb) queueIdleWork(()=>writeSaveValues([[key,value]]).catch(()=>{saveUnavailable=true;}));
}

function seedRecordMilestone(record) {
  if (record?.won===true||record?.milestone===ROUNDS) return ROUNDS;
  return record?.milestone===SEED_MILESTONE_ROUND ? SEED_MILESTONE_ROUND : 0;
}

function updateSeedRecords(records,{seed,milestone}) {
  const index=records.findIndex(record=>record.seed===seed);
  const previous=seedRecordMilestone(records[index]);
  if (milestone!==undefined&&index>=0) {
    if (milestone>previous) records[index]={seed,milestone};
    return;
  }
  if (index>=0) records.splice(index,1);
  records.unshift({seed,milestone:milestone??previous});
  if (records.length>SEED_RECORD_LIMIT) records.length=SEED_RECORD_LIMIT;
}

async function readSeedRecords() {
  if (!saveDb) return sessionSeedRecords;
  let records=[];
  try {
    const [stored]=await readSaveValues([SEED_RECORDS_KEY]);
    if (Array.isArray(stored)) records=stored;
  } catch {saveUnavailable=true;}
  for (const update of pendingSeedUpdates) updateSeedRecords(records,update);
  return records;
}

function recordSeed(seed,milestone) {
  const update={seed,milestone};
  if (!saveDb) {
    updateSeedRecords(sessionSeedRecords,update);
    return;
  }
  pendingSeedUpdates.push(update);
  if (!writingSeedRecords) queueBackgroundWork(()=>writeSeedRecords());
}
function restoreSeedMilestone(state) {
  if (state.phase==='won') {
    recordSeed(state.seed,ROUNDS);
  } else if (state.gameMode!=='experiment'&&state.round>=SEED_MILESTONE_ROUND) {
    recordSeed(state.seed,SEED_MILESTONE_ROUND);
  }
}
async function writeSeedRecords(leaving=false) {
  if (writingSeedRecords||!pendingSeedUpdates.length||!saveDb) return;
  if (!leaving&&boardBusy()) {
    queueBackgroundWork(()=>writeSeedRecords());
    return;
  }
  writingSeedRecords=true;
  try {
    while (pendingSeedUpdates.length) {
      const updates=pendingSeedUpdates.slice();
      await saveTransaction('readwrite',store=>{
        const history=store.get(SEED_RECORDS_KEY);
        history.onsuccess=()=>{
          const records=Array.isArray(history.result)?history.result:[];
          for (const change of updates) updateSeedRecords(records,change);
          store.put(records,SEED_RECORDS_KEY);
        };
        return [history];
      });
      pendingSeedUpdates.splice(0,updates.length);
    }
  } catch {saveUnavailable=true;}
  finally {writingSeedRecords=false;}
}

function migrateSavedRun(state) {
  state.potions=state.potions.map(id=>id==='enemyTurn'?'turn':id);
  for (const tile of [...state.pieces,...(state.reward?.enemies??[]),...(state.nextEnemies??[])]) {
    for (const [cell,id] of tile.pickups??[]) {
      if (id==='enemyTurn') tile.pickups.set(cell,'turn');
    }
    if (tile.openSeams) tile.openSeams=tile.openSeams.filter(([x,y,dx,dy])=>
      solidEnemyCell(tile,key(x,y))&&solidEnemyCell(tile,key(x+dx,y+dy)));
  }
}

function readSavedValue(key) {
  try {
    return JSON.parse(localStorage.getItem(key),(_,value)=>{
      if (Array.isArray(value?.$map)) return new Map(value.$map);
      if (Array.isArray(value?.$set)) return new Set(value.$set);
      return value;
    });
  } catch {
    return null;
  }
}

function placementProgress(state) {
  const positions=state.pieces.filter(piece=>piece.x!==piece.home.x||piece.y!==piece.home.y)
    .map(({id,x,y})=>[id,x,y]);
  if (!state.reward) return {positions};
  const homes=new Map(state.pieces.map(({id,home})=>[id,home]));
  const fragments=state.reward.placements.map(({card,fragment,origin,fragmentCells})=>{
    const home=homes.get(card);
    return {card,fragment,offset:[origin[0]-home.x,origin[1]-home.y],fragmentCells};
  });
  return {positions,fragments};
}

function restorePlacementProgress(state,progress) {
  const positions=new Map(progress.positions.map(([id,x,y])=>[id,{x,y}]));
  const pieces=state.pieces.map(piece=>{
    const {x,y}=positions.get(piece.id)??piece.home;
    return {...piece,x,y};
  });
  if (!state.reward||!Array.isArray(progress.fragments)) return {...state,pieces};
  const cards=new Map(pieces.map(piece=>[piece.id,piece]));
  const placements=progress.fragments.map(({card,fragment,offset,fragmentCells})=>{
    const target=cards.get(card), origin=[target.home.x+offset[0],target.home.y+offset[1]];
    return {card,fragment,origin,fragmentCells};
  });
  return {...state,pieces,reward:{...state.reward,placements}};
}

async function readRunSave(slot,summary=false) {
  if (pendingSaves.has(slot)) return pendingSaves.get(slot);
  const keys=[runSaveKey(slot),runProgressKey(slot),runPositionsKey(slot)];
  try {
    const stored=saveDb ? await readSaveValues(summary?[runSummaryKey(slot)]:keys) : [];
    if (summary&&stored[0]) return stored[0];
    const native=Boolean(stored[0]);
    const [save,progress,positions]=native?stored:keys.slice(0,summary?2:3).map(readSavedValue);
    if (GAME_MODES.includes(save?.run?.gameMode)&&Array.isArray(save.roundStarts)&&Number.isInteger(save.currentSeed)) {
      if (!native&&!summary) for (const state of [save.run,...save.roundStarts]) migrateSavedRun(state);
      if (typeof save.revision==='string') {
        let layout=save.revision;
        try {
          if (progress?.revision===save.revision&&progress.run?.seed===save.run.seed&&
              progress.run?.gameMode===save.run.gameMode) {
            if (!native&&!summary) migrateSavedRun(progress.run);
            save.run=progress.run;
            layout=typeof progress.layout==='string'?progress.layout:null;
          }
        } catch {}
        if (!summary&&layout) try {
          if (positions?.layout===layout) save.run=restorePlacementProgress(save.run,positions);
        } catch {}
        if (native) saveBases.set(slot,{revision:save.revision,layout,roundStarts:save.roundStarts});
      }
      if (save.run.gameMode==='experiment'&&Number.isInteger(save.run.seed)) save.currentSeed=save.run.seed;
      return save;
    }
    return null;
  } catch {
    saveUnavailable=true;
  }
}

async function writeRunSave(slot,save) {
  const {run:state,currentSeed,roundStarts,checkpoint}=save, base=saveBases.get(slot);
  // The next drag can already be in progress. Save only the committed layout.
  const committed=state===run&&drag ? {...state,pieces:state.pieces.map(piece=>
    piece===drag.piece ? {...piece,x:drag.origin[0],y:drag.origin[1]} : piece)} : state;
  writingSaves.set(slot,save);
  try {
    if (base?.roundStarts===roundStarts&&base.layout&&!checkpoint) {
      await writeSaveValues([[runPositionsKey(slot),{layout:base.layout,...placementProgress(committed)}]]);
    } else {
      const layout=Date.now().toString(36)+'-'+seedValue().toString(36);
      const {gameMode,round,phase}=committed;
      const summary=[runSummaryKey(slot),{currentSeed,run:{gameMode,round,phase}}];
      const revision=base?.roundStarts===roundStarts ? base.revision : layout;
      const update=revision===layout
        ? [runSaveKey(slot),{currentSeed,run:committed,roundStarts,revision}]
        : [runProgressKey(slot),{revision,layout,run:committed}];
      await writeSaveValues([update,summary]);
      saveBases.set(slot,{revision,layout,roundStarts});
    }
    if (pendingSaves.get(slot)===save) pendingSaves.delete(slot);
    unsavedSlots.delete(slot);
  } catch {
    unsavedSlots.add(slot);
    const pending=pendingSaves.get(slot);
    if (pending===save) pendingSaves.set(slot,{...save,run:committed,due:Infinity});
    else if (checkpoint&&pending) pending.checkpoint=true;
  } finally {
    writingSaves.delete(slot);
    if (document.hidden) flushRunSaves(true);
    else scheduleRunSave();
  }
}

function flushRunSaves(leaving=false) {
  if (!saveDb||(!leaving&&writingSaves.size)) return;
  const now=performance.now(), busy=!leaving&&boardBusy();
  for (const [slot,save] of pendingSaves) {
    if (writingSaves.has(slot)||!Number.isFinite(save.due)||(!leaving&&save.due>now)) continue;
    if (busy) {
      save.due=now+SAVE_IDLE_DELAY;
      continue;
    }
    writeRunSave(slot,save);
    if (!leaving) break;
  }
  scheduleRunSave();
}

function scheduleRunSave() {
  clearTimeout(saveTimer);
  if (!saveDb||saveTaskQueued||writingSaves.size) return;
  let due=Infinity;
  for (const [slot,save] of pendingSaves) if (!writingSaves.has(slot)) due=Math.min(due,save.due);
  if (due<Infinity) saveTimer=setTimeout(()=>{
    saveTaskQueued=true;
    queueBackgroundWork(deadline=>{
      saveTaskQueued=false;
      if (deadline&&deadline.timeRemaining()<4) scheduleRunSave();
      else flushRunSaves();
    });
  },Math.max(0,Math.ceil(due-performance.now())));
}

function stageRunSave(checkpoint=false) {
  const slot=activeSaveSlot, previous=pendingSaves.get(slot);
  const full=checkpoint||Boolean(previous?.checkpoint&&previous!==writingSaves.get(slot));
  pendingSaves.set(slot,{currentSeed,run,roundStarts,checkpoint:full,due:performance.now()+SAVE_IDLE_DELAY});
  scheduleRunSave();
}

function saveRun() {stageRunSave(true);}

function flushSavesBeforeLeaving() {
  flushRunSaves(true);
  writeSeedRecords(true);
}
window.addEventListener('pagehide',flushSavesBeforeLeaving);
document.addEventListener('visibilitychange',()=>{if (document.hidden) flushSavesBeforeLeaving();});

function selectSaveSlot(slot) {
  const outgoing=pendingSaves.get(activeSaveSlot);
  if (slot!==activeSaveSlot&&outgoing&&outgoing!==writingSaves.get(activeSaveSlot)) outgoing.due=0;
  activeSaveSlot=slot;
  saveMetadata(ACTIVE_SAVE_KEY,slot);
  scheduleRunSave();
}

const reduced=matchMedia('(prefers-reduced-motion: reduce)');

let locked=false, frameAnimation=0, giftNotice=0, giftTimer=0, showLimitHint=false;
let displayedHp=null;
const DISSOLVE_PATTERNS=8;
const dissolveFrames=new Map();
let upgradeDrag=null;
let trayOffset=0, minTrayOffset=0, maxTrayOffset=0;
let enemyTrayOffset=0, minEnemyTrayOffset=0;

const boardColors={paper:boardStyle.getPropertyValue('--paper').trim(),
  enemy:boardStyle.getPropertyValue('--red').trim(),card:'#343434'};

function announceGift(area) {

function chooseOpeningGift(state,cells) {
  if (run!==state||!state.pendingGift) return;
  const slot=state.cards.length;
  const gift={id:'p'+slot,slot,cells};
  const pieces=state.pieces.slice();
  const firstEnemy=pieces.findIndex(piece=>piece.kind==='enemy');
  pieces.splice(firstEnemy<0 ? pieces.length : firstEnemy,0,...makeTray([gift],'card',trayOffset));
  run={...state,cards:[...state.cards,gift],pieces};
  delete run.pendingGift;
  locked=false;
  showOpeningGift();
  resize();

  announceGift(gift.cells.length);

}

function showOpeningGift() {
  const state=run, panel=$('opening-gift'), choices=$('gift-choices');
  panel.hidden=!state.pendingGift;
  choices.replaceChildren();
  if (!state.pendingGift) return;
  const generation=openingGiftChoices(state);
  const load=deadline=>{
    if (run!==state||!state.pendingGift) return;
    const end=performance.now()+4;
    let result;
    while (performance.now()<end&&(deadline?.timeRemaining()??4)>1) {
      result=generation.next();
      if (result.done) break;
    }
    if (!result?.done) {queueBackgroundWork(load);return;}
    const cellPixels=8, side=giftSpan(state.round)*cellPixels;
    for (const [index,cells] of result.value.entries()) {
      const button=document.createElement('button');
      button.type='button';
      button.className='gift-choice';
      button.dataset.label=index===0?'firstGift':'secondGift';
      button.setAttribute('aria-label',message(button.dataset.label));
      const preview=document.createElement('canvas');
      preview.width=preview.height=side;
      preview.setAttribute('aria-hidden','true');
      const paint=preview.getContext('2d');
      const {w,h}=bounds(cells);
      const left=Math.floor((side-w*cellPixels)/2), top=Math.floor((side-h*cellPixels)/2);
      paint.fillStyle=boardColors.card;
      for (const [x,y] of cells) paint.fillRect(left+x*cellPixels,top+y*cellPixels,cellPixels,cellPixels);
      button.append(preview);
      button.onclick=()=>chooseOpeningGift(state,cells);
      choices.append(button);
    }
    if (!$('info').open) choices.firstElementChild.focus({preventScroll:true});
  };
  queueBackgroundWork(load);
}

function settleSpan(scale) {
  return Math.min(FIELD.size,2*Math.ceil(SETTLE_MIN_SIZE/(2*scale)));
}
function potionButtonSize(ratio) {
  return Math.max(28,TRAY_ICON_PIXELS/ratio+8);
}
function potionRails(scale,ratio) {
  const preferredSize=potionButtonSize(ratio);
  let size=preferredSize;
  let step=Math.ceil((size+3)/scale);
  const settleCells=settleSpan(scale);
  const settleLeft=(FIELD.size-settleCells)/2, settleRight=settleLeft+settleCells;
  const gap=Math.ceil(8/scale);
  const skillSpace=ADVANCED_ENEMY_CELLS?Math.ceil(31/scale):0;
  let skillsColumn=settleRight+gap;
  const rightStart=skillsColumn+skillSpace;
  const columnsIn=space=>Math.max(0,Math.floor((space-size/scale)/step+1+1e-6));
  let leftColumns=Math.min(5,columnsIn(settleLeft-gap));
  let rightColumns=columnsIn(FIELD.size-rightStart);
  const columnsNeeded=Math.ceil(Object.keys(POTIONS).length/2);
  const stacked=leftColumns+rightColumns<columnsNeeded;
  if (stacked) {
    skillsColumn=Math.max(columnsNeeded,FIELD.size-skillSpace);
    leftColumns=columnsNeeded;
    rightColumns=0;
    step=Math.min(step,Math.floor(skillsColumn/leftColumns));
    size=Math.min(size,Math.max(1,step*scale-Math.min(3,scale)));
  }
  const height=step*scale+size;
  const rise=stacked?Math.ceil((height+8)/scale):0;
  const iconPixels=size===preferredSize?TRAY_ICON_PIXELS:Math.max(1,Math.floor((size-4)*ratio));
  return {size,step,settleCells,leftColumns,rightColumns,skillsColumn,rightStart,height,stacked,rise,iconPixels};
}
function settlementGapRows(space,buttonHeight,rail,scale) {
  const center=Math.max(rail.rise,Math.round((space-buttonHeight)/(2*scale)));
  const belowButton=rail.stacked?buttonHeight:Math.max(buttonHeight,rail.height);
  const last=Math.floor((space-belowButton)/scale+1e-6);
  return Math.max(0,Math.min(center,last));
}
function setPixelSizes(style,sizes) {
  for (const [name,size] of Object.entries(sizes)) style.setProperty(name,size+'px');
}
function gameRect(element) {
  const {left,top,right,bottom,width,height}=element.getBoundingClientRect();
  return {left:left/gameZoom,top:top/gameZoom,right:right/gameZoom,bottom:bottom/gameZoom,
    width:width/gameZoom,height:height/gameZoom};
}
function layoutPotionTrays(sheet,arenaStart,width,rails) {
  const {size,step,leftColumns,rightColumns,skillsColumn,rightStart,rise}=rails;
  const minColumn=Math.ceil((8-arenaStart)/unit);
  const maxColumn=Math.floor((width-8-arenaStart)/unit);
  const panelWidth=200;
  const panelLast=Math.floor(maxColumn-panelWidth/unit+1e-6);
  const panelColumn=column=>Math.max(minColumn,Math.min(column,panelLast));
  const railWidth=columns=>columns>0?(columns-1)*step*unit+size:0;
  const panelGap=(rise+Math.ceil(8/unit))*unit;
  setPixelSizes(sheet,{
    '--potion-size':size,
    '--potion-step':step*unit,
    '--potion-left-width':railWidth(leftColumns),
    '--potion-right':Math.min(FIELD.size,rightStart)*unit,
    '--potion-right-width':railWidth(rightColumns),
    '--skills-left':skillsColumn*unit,
    '--potion-rail-top':-rise*unit,
    '--potion-panel-width':panelWidth,

function joinedCellRects(size,fill) {

    const anchor=unavailable&&boardRun.phase!=='reward' ? piece.home??piece : piece;
    const held=!showingSettlement&&piece===drag?.piece;
    const insideColor=held?'#202020':boardColors.card;
    const outsideColor=held?'#606060':'#737373';

      const xx=anchor.x+x, yy=anchor.y+y;

  if (offset===current) return;
  event.preventDefault();
  if (isEnemy) positionTrays(trayOffset,offset);
  else positionTrays(offset);
  refresh();
},{passive:false});

canvas.addEventListener('keydown',event=>{
  if (!battleReady()||drag||potionChoice?.edit) return;
  if (potionKey(event)) return;
  if (event.key==='1'||event.key==='2') {
    setMode(event.key==='1'?'card':'enemy');
    refresh();
    return;
  }
  const piece=run.pieces.find(p=>p.id===selected);
  if (!piece||piece.banned||piece.inactive) return;
  const moves={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if (moves[event.key]) {
    event.preventDefault();
    const {x,y}=piece;
    const [dx,dy]=moves[event.key];
    movePiece(piece,x+dx,y+dy);
    if (!active(piece)) returnToSlot(piece);
    refresh();
    if (piece.x!==x||piece.y!==y) stageRunSave();
  }
});

function showInfo(title,content,buttons) {
  hideHoverTip();
  const target=$('info');
  target.dataset.topic=title;
  $('info-title').textContent=message(title);
  const dismiss=buttons.find(([text])=>text==='close'||text==='keepPlaying');
  const closeButton=$('info-close');
  closeButton.hidden=!dismiss;
  if (dismiss) {
    const [text,action]=dismiss;
    closeButton.setAttribute('aria-label',message(text));
    closeButton.onclick=()=>{target.close();action?.();};
  }
  $('info-body').replaceChildren(...content.map(item=>{
    if (typeof item!=='string') return item;
    const p=document.createElement('p');p.textContent=item;return p;
  }));
  const footer=buttons.filter(button=>button!==dismiss);
  $('info-actions').replaceChildren(...footer.map(([text,action],i)=>{
    const button=document.createElement('button');
    button.className=i===footer.length-1?'action':'quiet';
    button.textContent=message(text);button.onclick=()=>{target.close();action?.();};return button;
  }));
  if (!target.open) target.showModal();
}
$('help').onclick=()=>showInfo('help',battleHelpParagraphs(),[['close']]);
$('potion-guide').onclick=()=>{

  for (const [id,potion] of Object.entries(POTIONS)) {
    const [name,description]=potion[gearLanguage()];
    const item=document.createElement('li');
    const icon=createPotionIcon(id,GUIDE_ICON_PIXELS);
    const text=document.createElement('div');
    const title=document.createElement('h3');
    title.textContent=name;
    const detail=document.createElement('p');
    detail.textContent=description;
    text.append(title,detail);

  snapPotionIcons(list);
};
function showRun(next) {
  cancelAnimationFrame(frameAnimation);
  clearTimeout(giftTimer);
  showLimitHint=false;
  displayedHp=null;
  frameAnimation=0;locked=Boolean(next.pendingGift);drag=null;selected=null;giftNotice=0;
  upgradeDrag=null;trayOffset=enemyTrayOffset=maxTrayOffset;
  delete frame.dataset.sideFlash;
  setMode('');
  discardPotion(false);
  gearStamp='';
  run=next;
  resize();
  showOpeningGift();
  prepareBaseEnemies(next);
}
function beginRun(seed,gameMode,slot=activeSaveSlot) {
  const next=newRun(seed,gameMode);
  currentSeed=next.seed;
  roundStarts=[structuredClone(next)];
  showRun(next);
  rememberSeed(currentSeed);
  recordSeed(next.seed);
  if (slot!==activeSaveSlot) selectSaveSlot(slot);
  saveRun();
}
function undoRoundStart() {
  const start=roundStarts.at(-1);
  if (!start||run.phase!=='battle') return start;
  const usedItem=run.potions.length!==start.potions.length;
  const movedPiece=run.pieces.some(piece=>piece.x!==piece.home.x||piece.y!==piece.home.y);
  return usedItem||movedPiece ? start : roundStarts.at(-2);
}
function showUndoRound() {
  const start=undoRoundStart();
  if (!start||locked||drag||upgradeDrag) return;
  showInfo('undoRound',[message('undoRoundPrompt',start.round)],[['keepPlaying'],['confirm',()=>{
    const restored=structuredClone(start);
    // Keep the run's free scout choice when returning to a battle start.
    if (run.freeScoutRound!=null) {
      restored.freeScoutRound=run.freeScoutRound;
      restored.scoutedRounds.add(restored.freeScoutRound);
      restored.scouted=restored.scoutedRounds.has(restored.round+1);
    }
    if (start!==roundStarts.at(-1)) roundStarts=roundStarts.slice(0,-1);
    showRun(restored);
    saveRun();
    canvas.focus({preventScroll:true});
  }]]);
}
