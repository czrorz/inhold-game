const ADVANCED_ENEMY_CELLS = false;
const SKILL_ROUNDS = ADVANCED_ENEMY_CELLS ? {exact:9,triple:13} : {};
const ENEMY_PRIORITY = {seal:0, hole:1, heavy:2, persist:3, normal:4, gray:5};
const ENEMY_EFFECTS = [
  [], [], [], ['gray'], [], ['heavy'],
  ['gray'], ['seal','heavy'], ['heavy'],
  ['hole','gray'], ['seal'], ['persist','heavy'],
  ['seal','hole','gray'], ['persist','heavy'],
  ['seal','heavy'], ['hole','persist','gray'],
  ['seal','heavy','heavy'], ['seal','hole','heavy'],
  ['seal','persist','heavy','heavy','gray'],
  ['seal','seal','hole','persist','heavy','heavy','heavy']
];

const HOLLOW_START_ROUND = 3;
const FINAL_HOLLOW_SHARE = .20;
const STANDARD_ENEMY_OPEN_SEAM_CHANCE = .09;
const ENEMY_OPEN_SEAM_CHANCE = .18;

const solidEnemyCell=(piece,id)=>(piece.marks?.[id]??'normal')==='normal';

function rollEnemySeams(piece,seed,round,gameMode,preview=false) {
  const rng=generator(seed,round,(preview?200:100)+piece.slot);
  const chance=gameMode==='standard'?STANDARD_ENEMY_OPEN_SEAM_CHANCE:ENEMY_OPEN_SEAM_CHANCE;
  const occupied=new Set(piece.cells.map(cell=>key(...cell)).filter(id=>preview||solidEnemyCell(piece,id)));
  const seams=[];
  for (const [x,y] of piece.cells) {
    if (!occupied.has(key(x,y))) continue;
    for (const [dx,dy] of [[1,0],[0,1]]) {
      if (occupied.has(key(x+dx,y+dy))&&rng()<chance) seams.push([x,y,dx,dy]);
    }
  }
  return seams;
}

function enemyOpenSeams(piece,seed,round,gameMode) {
  if (piece.swapped&&!piece.free&&piece.openSeams?.length!==0) piece.openSeams=[];
  return piece.openSeams??=rollEnemySeams(piece,seed,round,gameMode);
}

function transformedEnemySeams(seams,sources) {
  const bySource=new Map();
  for (const [target,source] of sources) bySource.set(source,target.split(',').map(Number));
  const result=[];
  for (const [x,y,dx,dy] of seams) {
    const a=bySource.get(key(x,y)), b=bySource.get(key(x+dx,y+dy));
    if (!a||!b) continue;
    const width=Math.abs(a[0]-b[0]),height=Math.abs(a[1]-b[1]);
    if (width+height===1) result.push([Math.min(a[0],b[0]),Math.min(a[1],b[1]),width,height]);
  }
  return result;
}

const enemyGeometryCache=new WeakMap();
function enemyGeometry(piece,seed,round,gameMode) {
  const seams=enemyOpenSeams(piece,seed,round,gameMode);
  const cached=enemyGeometryCache.get(seams);
  if (cached?.shape===piece.cells&&cached.marks===piece.marks&&cached.pickups===piece.pickups) return cached.cells;
  const byCell=new Map();
  for (const [x,y] of piece.cells) {
    const id=key(x,y);
    const type=pieceCellType(piece,id);
    if (type!=='pickup') byCell.set(id,{x,y,id,type,joined:null});
  }
  for (const [x,y,dx,dy] of seams) {
    const a=byCell.get(key(x,y)), b=byCell.get(key(x+dx,y+dy));
    if (a?.type!=='normal'||b?.type!=='normal') continue;
    const first=a.joined, second=b.joined;
    if (first&&first===second) continue;
    const group=first??second??new Set();
    group.add(a.id).add(b.id);
    if (first&&second) for (const id of second) group.add(id);
    for (const id of group) byCell.get(id).joined=group;
  }
  const cells=[...byCell.values()];
  for (const cell of cells) {
    const {x,y,joined}=cell;
    if (!joined) continue;
    const left=joined.has(key(x-1,y)), top=joined.has(key(x,y-1));
    const right=joined.has(key(x+1,y)), bottom=joined.has(key(x,y+1));
    cell.joinedFill={
      left,top,right,bottom,
      cutTopLeft:left&&top&&!joined.has(key(x-1,y-1)),
      cutTopRight:right&&top&&!joined.has(key(x+1,y-1)),
      cutBottomLeft:left&&bottom&&!joined.has(key(x-1,y+1)),
      cutBottomRight:right&&bottom&&!joined.has(key(x+1,y+1))
    };
  }
  enemyGeometryCache.set(seams,{shape:piece.cells,marks:piece.marks,pickups:piece.pickups,cells});
  return cells;
}

function enemyCards(run,round=run.round) {
  const rng=generator(run.seed,round,1);
  const effects=ADVANCED_ENEMY_CELLS ? ENEMY_EFFECTS[round-1]??[] : [];
  const demand=run.gameMode==='standard' ? STANDARD_DEMAND : ADVANCED_DEMAND;
  const target=demand[round-1];
  const spread=Math.max(1,Math.round(.055*target));
  const area=round===1 ? target : rangeInt(target-spread,target+spread,rng);
  const heavy=effects.filter(effect=>effect==='heavy').length;
  // Hollow markings convert existing cells. Only heavy cells add a damage point.
  const reserve=ADVANCED_ENEMY_CELLS ? round>=16 ? 4 : round>=8 ? 2 : 0 : 0;
  const span=Math.min(MAX_PIECE_SPAN,Math.round((round+4)*.8));
  const enemies=enemyGroups(round,rng,area-heavy-reserve).map((size,index)=>{
    const density=round<=4 ? .48+rng()*.27 : rng()<.14 ? .46+rng()*.13 : .21+rng()*.13;
    return {id:'e'+index,slot:index,cells:rolledShape(size,span,density,rng,round>5 && rng()<.3),marks:{}};
  });
  const markRng=generator(run.seed,round,4);
  const solidSlots=enemies.flatMap(enemy=>enemy.cells.map(cell=>({enemy,cell})));
  const total=solidSlots.length;
  for (const effect of effects) {
    const [{enemy,cell}]=solidSlots.splice(rangeInt(0,solidSlots.length-1,markRng),1);
    enemy.marks[key(...cell)]=effect;
  }
  if (round>=HOLLOW_START_ROUND) {
    const openingShare=2/demand[HOLLOW_START_ROUND-1];
    const progress=(round-HOLLOW_START_ROUND)/(ROUNDS-HOLLOW_START_ROUND);
    const share=openingShare+(FINAL_HOLLOW_SHARE-openingShare)*progress;
    const count=Math.min(solidSlots.length,Math.round(total*share));
    for (let index=0;index<count;index++) {
      const [{enemy,cell}]=solidSlots.splice(rangeInt(0,solidSlots.length-1,markRng),1);
      enemy.marks[key(...cell)]='hollow';
    }
  }
  for (const enemy of enemies) enemyGeometry(enemy,run.seed,round,run.gameMode);
  return enemies;
}

function randomFragment(size,rng) {
  const positions=Array.from({length:size*size},(_,index)=>index);
  const cells=Array.from({length:size},()=>{
    const [position]=positions.splice(rangeInt(0,positions.length-1,rng),1);
    return [position%size,Math.floor(position/size)];
  });
  return normalize(cells);
}

function rewards(run,carry=0,gray=0) {
  const rng=generator(run.seed,run.round,2);
  const round=run.round;
  const area=fragmentArea(round,run.gameMode);
  const fragments=Array.from({length:5+Math.floor((round-1)/4)},()=>randomFragment(area,rng));
  const enemies=nextEncounter(run).slice();
  if (carry) {
    const slot=enemies.length;
    const cells=Array.from({length:carry},(_,index)=>[index,0]);
    enemies.push({id:'e'+slot,slot,cells,marks:{}});
  }
  return {fragments,placements:[],enemies,gray};
}

function slotOrigin(slot,isEnemy,offset=0) {
  const column=slot%2, row=Math.floor(slot/2);
  const columnOffset=trayInset+column*MAX_PIECE_SPAN;
  return {
    x:isEnemy ? FIELD.x+FIELD.size+columnOffset : FIELD.x-MAX_PIECE_SPAN-columnOffset,
    y:SLOT_TOP+row*MAX_PIECE_SPAN+offset
  };
}
function slotPosition(piece,isEnemy,offset=0) {
  const origin=slotOrigin(piece.slot,isEnemy,offset);
  const saved=piece.slotOffset;
  if (saved?.x!=null&&saved.y!=null) return {x:origin.x+saved.x,y:origin.y+saved.y};
  const {w,h}=bounds(piece.layoutCells||piece.cells);
  const inset=(MAX_PIECE_SPAN-w)/2;
  return {
    x:origin.x+(saved?.x ?? (isEnemy ? Math.ceil(inset) : Math.floor(inset))),
    y:origin.y+(saved?.y ?? Math.floor((MAX_PIECE_SPAN-h)/2))
  };
}
function makeTray(cards,kind) {
  return cards.map(card=>{
    const home=slotPosition(card,kind==='enemy');
    return {...card,kind,...home,home};
  });
}

function battleCards(run) {
  return makeTray(run.cards,'card').map(piece=>{
    const eaten=run.eatenNext?.get(piece.id);
    const cells=eaten ? piece.cells.filter(cell=>!eaten.has(key(...cell))) : piece.cells;
    return {
      ...piece, cells:cells.length ? cells : piece.cells,
      layoutCells:eaten ? piece.cells : undefined,
      banned:run.sealNext?.has(piece.id)||!cells.length
    };
  });
}

function startBattle(run,enemies=enemyCards(run)) {
  run.phase='battle';
  run.reward=null;
  delete run.nextEnemies;
  delete run.nextEnemySwaps;
  delete run.nextEnemyUsed;
  delete run.damageHalvings;
  run.temporarilyChangedCards=new Set();
  run.pieces=[...battleCards(run),...makeTray(enemies,'enemy')];
  run.sealNext=new Set();
  run.eatenNext=new Map();
  run.retainedEdges=run.keepEdges??[];
  run.keepEdges=[];
  run.edgeRetentionActive=false;
  run.bonusCells=[];
  run.cast=null;
  run.scouted=run.scoutedRounds.has(run.round+1);
  if (run.gameMode==='experiment') {
    // Leave enough life to try effects that carry into the next battle.
    run.hp=HP+enemies.reduce((total,enemy)=>total+enemy.cells.length,0);
  }
  const drops=rollPotions(run);
  if (!drops.length) return;
  const carriers=run.pieces.filter(piece=>piece.kind==='enemy').map(piece=>{
    if (piece.pickups) piece.pickups=new Map(piece.pickups);
    const silhouette=new Set(potionSolidify(piece.cells.map(([x,y])=>({x,y})),false).map(({x,y})=>key(x,y)));
    const cells=piece.cells.filter(([x,y])=>piece.marks?.[key(x,y)]!=='hollow'&&!piece.pickups?.has(key(x,y))&&
      CARDINAL.some(([dx,dy])=>!silhouette.has(key(x+dx,y+dy))));
    return {piece,cells};
  }).filter(carrier=>carrier.cells.length>=drops.length);
  const rng=generator(run.seed,run.round,6);
  const carrier=randomItem(carriers,rng);
  if (!carrier) return;
  carrier.piece.pickups??=new Map();
  for (const type of drops) {
    const [cell]=carrier.cells.splice(rangeInt(0,carrier.cells.length-1,rng),1);
    carrier.piece.pickups.set(key(...cell),type);
  }
}

function testCardShapes(rng) {
  const patterns=[
    ['..#######..','.########..','.##.....#..','.##.....###','.##.....###','..#######..','..#######..'],
    ['##.......##','##.......##','##.......##','##.......##','##.......##','###########','###########'],
    ['....###....','....####...','###########','###########','..###......','..###......']
  ];
  const shapes=patterns.map(rows=>normalize(rows.flatMap((row,y)=>
    [...row].flatMap((cell,x)=>cell==='#'?[[x,y]]:[]))));
  shapes.push(...Array.from({length:2},()=>rolledShape(EXPERIMENT_MAX_CARD_AREA,11,.45,rng,false,true)));
  return shapes;
}

const GAME_MODES=['standard','advanced','experiment'];
const SEED_HISTORY_KEY='inhold.seedHistory';
const SEED_HISTORY_LIMIT=10;
let recentSeeds;

function loadSeedHistory(saved) {
  try {
    saved??=readSavedValue(SEED_HISTORY_KEY);
    const entries=Array.isArray(saved)?saved:saved?.entries;
    if (!Array.isArray(entries)) return {entries:[]};
    const distinct=new Map();
    for (const entry of entries) {
      const seed=entry?.seed;
      if (!Number.isInteger(seed)||seed!==(seed>>>0)||distinct.has(seed)) continue;
      distinct.set(seed,{seed,favorite:entry.favorite===true});
      if (distinct.size===SEED_HISTORY_LIMIT) break;
    }
    const history=[...distinct.values()];
    const seed=saved?.currentSeed;
    const currentSeed=Number.isInteger(seed)&&seed===(seed>>>0)?seed:history[0]?.seed;
    return {currentSeed,entries:history};
  } catch {
    return {entries:[]};
  }
}

function saveSeedHistory(history) {
  recentSeeds=history;
  saveMetadata(SEED_HISTORY_KEY,history);
}

function rememberSeed(seed) {
  const {entries}=recentSeeds;
  const played=entries.find(entry=>entry.seed===seed)??{seed,favorite:false};
  const recent=[played,...entries.filter(entry=>entry!==played)];
  if (recent.length>SEED_HISTORY_LIMIT) {
    const oldest=recent.findLastIndex(entry=>!entry.favorite);
    recent.splice(oldest,1);
  }
  saveSeedHistory({currentSeed:seed,entries:recent});
}

function setSeedFavorite(seed,favorite) {
  const history=recentSeeds;
  const entry=history.entries.find(entry=>entry.seed===seed);
  if (!entry) return false;
  entry.favorite=favorite;
  saveSeedHistory(history);
  return true;
}

function newRun(seed,gameMode='standard') {
  const experiment=gameMode==='experiment';
  seed??=seedValue();
  const rng=generator(seed,1,0);
  const shapes=experiment ? testCardShapes(rng) : Array.from({length:3},()=>walk(START_CARD_AREA,3,rng,true));
  const cards=shapes.map((cells,slot)=>({id:'p'+slot,slot,cells}));
  const run={seed,gameMode,round:experiment?EXPERIMENT_START_ROUND:1,hp:HP,phase:'battle',reward:null,cards,
    potions:experiment?Object.keys(POTIONS).flatMap(id=>Array(MAX_POTION_STACK-1).fill(id)):[],scoutedRounds:new Set()};
  startBattle(run);
  return run;
}

function active(piece) {
  return !piece.inactive&&!piece.banned&&piece.cells.some(([x,y])=>inDefense(piece.x+x,piece.y+y));
}
function deployment(run) {
  const deployed=new Set();
  for (const piece of run.pieces) {
    if (piece.kind==='card'&&!piece.free&&active(piece)) deployed.add(piece.sourceId??piece.id);
  }
  const count=deployed.size;
  const limit=deployLimit(run.round);
  return {count,limit,overLimit:count>limit};
}

function shieldDepth(covers,bonus) {
  let depth=bonus?1:0;
  for (const cover of covers??[]) depth=Math.max(depth,cover.depth);
  return depth;
}

function clearJoinedGroups(groups,coverings,stacks,bonus) {
  const cleared=new Set(), space=new Map();
  // A joined group needs one available shield layer in every cell.
  for (const [group,{cells}] of groups) {
    const first=coverings.get(cells[0]);
    if (!first?.some(({piece})=>cells.every(id=>coverings.get(id)?.some(cover=>cover.piece===piece)))) continue;
    if (!cells.every(id=>{
      if (!space.has(id)) {
        const priority=stacks.get(id).filter(layer=>ENEMY_PRIORITY[layer.type]<ENEMY_PRIORITY.normal).length;
        space.set(id,shieldDepth(coverings.get(id),bonus.has(id))-priority);
      }
      return space.get(id)>0;
    })) continue;
    cleared.add(group);
    for (const id of cells) space.set(id,space.get(id)-1);
  }
  return cleared;
}

const enemyPlacementCache=new WeakMap();
let cachedEnemyLayout;
function enemyPlacement(piece,{seed,round,gameMode}) {
  const shape=enemyGeometry(piece,seed,round,gameMode), cached=enemyPlacementCache.get(piece);
  if (cached?.shape===shape&&cached.x===piece.x&&cached.y===piece.y) return cached;
  const cells=shape.map(({x,y,type,joined,joinedFill})=>{
    const xx=x+piece.x, yy=y+piece.y;
    return {piece,x:xx,y:yy,id:key(xx,yy),type,joined,joinedFill};
  });
  const placed={piece,shape,x:piece.x,y:piece.y,cells};
  enemyPlacementCache.set(piece,placed);
  return placed;
}

function enemyLayout(run) {
  const placed=run.pieces.filter(piece=>piece.kind==='enemy'&&!piece.inactive&&!piece.banned)
    .map(piece=>enemyPlacement(piece,run));
  const cached=cachedEnemyLayout;
  if (cached?.placed.length===placed.length&&placed.every((entry,i)=>entry===cached.placed[i])) return cached;
  const stacks=new Map(), hollowOwners=new Map(), joinedGroups=new Map();
  const overlapped=new Set(), singleEnemyAt=new Map();
  for (const {piece,cells} of placed) for (const cell of cells) {
    const {id,type,joined}=cell, kinds=type==='hollow'?hollowOwners:stacks;
    const layers=kinds.get(id)??[];
    layers.push(cell);
    kinds.set(id,layers);
    if (joined) {
      if (!joinedGroups.has(joined)) joinedGroups.set(joined,{slot:piece.slot,cells:[]});
      joinedGroups.get(joined).cells.push(id);
    }
  }
  for (const [id,owners] of hollowOwners) {
    const stack=stacks.get(id);
    if (!stack) continue;
    // A group of coincident hollows adds exactly one ordinary layer.
    stack.push({piece:owners[0].piece,type:'normal',hollowOwners:owners});
    hollowOwners.delete(id);
  }
  for (const [id,layers] of stacks) {
    if (layers.length===1) {
      singleEnemyAt.set(id,layers[0].piece);
      continue;
    }
    layers.sort((a,b)=>ENEMY_PRIORITY[a.type]-ENEMY_PRIORITY[b.type]||
      Number(Boolean(b.joined))-Number(Boolean(a.joined))||
      Number(Boolean(a.hollowOwners))-Number(Boolean(b.hollowOwners))||a.piece.slot-b.piece.slot);
    for (const layer of layers) {
      overlapped.add(layer.piece);
      for (const owner of layer.hollowOwners??[]) overlapped.add(owner.piece);
    }
  }
  for (const [id,owners] of hollowOwners) {
    if (owners.length===1) singleEnemyAt.set(id,owners[0].piece);
    else for (const {piece} of owners) overlapped.add(piece);
  }
  const groups=[...joinedGroups].sort(([,a],[,b])=>a.slot-b.slot);
  return cachedEnemyLayout={placed,stacks,hollowOwners,joinedGroups:groups,overlapped,singleEnemyAt};
}

function settlement(run,preview=false,previewEnemies=[]) {
  const {placed,stacks,hollowOwners,joinedGroups,overlapped,singleEnemyAt}=enemyLayout(run);
  const coverings=new Map(), styledEnemies=new Set(overlapped);
  const pickups=[];
  const pickupCarriers=previewEnemies.length
    ? placed.concat(previewEnemies.map(piece=>({piece})))
    : placed;
  for (const {piece} of pickupCarriers) {
    if (!piece.pickups?.size) continue;
    const edited=previewEnemies.includes(piece);
    const cells=cellKeys(piece.cells);
    for (const [cell,type] of piece.pickups) {
      if (!type||!cells.has(cell)) continue;
      const [dx,dy]=cell.split(',').map(Number), x=piece.x+dx, y=piece.y+dy;
      const id=key(x,y);
      if (stacks.has(id)||hollowOwners.has(id)) continue;
      if (previewEnemies.some(other=>other!==piece&&hitSolid(other,x,y)&&
        (edited||pieceCellType(other,key(x-other.x,y-other.y))!=='pickup'))) continue;
      pickups.push({x,y,piece,cell,type});
    }
  }
  for (const piece of run.pieces) {
    if (piece.kind==='enemy'||piece.inactive||piece.banned) continue;
    for (const [x,y] of piece.cells) {
      const xx=x+piece.x, yy=y+piece.y;
      if (!inDefense(xx,yy)) continue;
      const id=key(xx,yy), local=key(x,y), group=coverings.get(id)||[];
      group.push({piece,local,depth:piece.double?.has(local) ? 2 : 1});
      coverings.set(id,group);
    }
  }
  const retained=new Set(retainedEdgeCells(run.retainedEdges).map(([x,y])=>key(x,y)));
  const bonus=new Set(retained);
  for (const [x,y] of run.bonusCells??[]) {
    if (inDefense(x,y)) bonus.add(key(x,y));
  }
  const touchesEdge=(x,y)=>CARDINAL.some(([dx,dy])=>{
    const neighbor=key(x+dx,y+dy);
    return (retained.has(neighbor)&&!retained.has(key(x,y)))||
      coverings.get(neighbor)?.some(({piece})=>!cellKeys(piece.cells).has(key(x-piece.x,y-piece.y)));
  });
  const uncovered=new Map(), absorbed=new Set(), hollows=new Map();
  const remainingTypes=new Map(), resolvedTypes=new Map(), unclean=new Set();
  const visibleJoined=new Map(), partialJoined=new Set();
  const sealed=new Set(), eaten=new Map(), consumed=[];
  let damage=0, carry=0, gray=0;
  for (const [id,owners] of hollowOwners) {
    const {x,y}=owners[0];
    const resolved=touchesEdge(x,y);
    hollows.set(id,resolved);
    if (resolved) {
      for (const {piece} of owners) styledEnemies.add(piece);
    } else {
      damage++;
      if (!preview) for (const {piece} of owners) unclean.add(piece.id);
    }
  }
  const cleared=clearJoinedGroups(joinedGroups,coverings,stacks,bonus);
  for (const [id,layers] of stacks) {
    const count=layers.length;
    const covers=coverings.get(id)||[];
    const hasBonus=bonus.has(id);
    const available=shieldDepth(covers,hasBonus);
    const overlapping=covers.length+Number(hasBonus)>1;
    let used=0, firstCovered, firstUncovered;
    for (const layer of layers) {
      if (available) styledEnemies.add(layer.piece);
      const covered=used<available&&(!layer.joined||cleared.has(layer.joined));
      if (!preview&&(overlapping||!covered)) {
        unclean.add(layer.piece.id);
        if (layer.hollowOwners) for (const {piece} of layer.hollowOwners) unclean.add(piece.id);
      }
      if (covered) {
        firstCovered??=layer;
        used++;
        if (!preview&&layer.type!=='normal') consumed.push({layer,covers});
      } else {
        firstUncovered??=layer;
        damage+=layer.type==='heavy' ? 2 : 1;
        if (layer.type==='persist') carry++;
      }
    }
    if (firstCovered) {
      absorbed.add(id);
      resolvedTypes.set(id,firstCovered.type);
    }
    if (firstUncovered) {
      uncovered.set(id,count-used);
      remainingTypes.set(id,firstUncovered.type);
      if (firstUncovered.joined&&covers.length) partialJoined.add(id);
    }
    const {joinedFill}=firstUncovered??firstCovered;
    if (joinedFill) visibleJoined.set(id,joinedFill);
  }
  for (const {layer,covers} of consumed) {
    const {type,piece}=layer;
    if (type==='gray') {
      gray=1;
      continue;
    }
    if (type!=='seal'&&type!=='hole') continue;
    if (run.round>=SKILL_ROUNDS.exact&&!unclean.has(piece.id)) continue;
    const realCards=covers.filter(cover=>!cover.piece.free);
    const sourceIds=new Set(realCards.map(({piece})=>piece.sourceId??piece.id));
    if (type==='seal'&&run.round>=SKILL_ROUNDS.triple&&sourceIds.size>=3) continue;
    for (const cover of realCards) {
      const sourceId=cover.piece.sourceId??cover.piece.id;
      if (type==='seal') {
        sealed.add(sourceId);
      } else {
        const original=cover.piece.sourceCells ? cover.piece.sourceCells.get(cover.local) : cover.local;
        if (original===undefined) continue;
        const cells=eaten.get(sourceId)||new Set();
        cells.add(original);
        eaten.set(sourceId,cells);
      }
    }
  }
  const stock=pickups.length?potionStock(run.potions):new Map();
  for (const pickup of pickups) {
    const count=stock.get(pickup.type)??0;
    const id=key(pickup.x,pickup.y);
    pickup.collected=count<MAX_POTION_STACK&&
      (coverings.has(id)||retained.has(id)||touchesEdge(pickup.x,pickup.y));
    if (pickup.collected) stock.set(pickup.type,count+1);
  }
  return {
    damage:Math.floor(damage/2**(run.damageHalvings??0)),
    absorbed,uncovered,remainingTypes,resolvedTypes,hollows,visibleJoined,partialJoined,
    shield:preview?null:new Set([...coverings.keys(),...bonus]),
    placed,styledEnemies,singleEnemyAt,
    sealed,eaten,carry,gray,pickups,
    nextEdges:run.edgeRetentionActive?potionSharedEdges(run.pieces):[]
  };
}

function finishBattle(run,result) {
  run.hp=Math.max(0,run.hp-result.damage);
  for (const {piece,cell,type,collected} of result.pickups) {
    if (!collected||!piece.pickups.delete(cell)) continue;
    piece.cells=piece.cells.filter(([x,y])=>key(x,y)!==cell);
    piece.marks=Object.fromEntries(Object.entries(piece.marks??{}).filter(([id])=>id!==cell));
    if (piece.openSeams) piece.openSeams=piece.openSeams.filter(([x,y,dx,dy])=>
      key(x,y)!==cell&&key(x+dx,y+dy)!==cell);
    if (!piece.cells.length) piece.inactive=true;
    run.potions.push(type);
  }
  if (!run.hp) run.phase='lost';
  else if (run.round===ROUNDS) run.phase='won';
  else {
    run.phase='reward';
    run.sealNext=result.sealed;
    run.eatenNext=result.eaten;
    run.keepEdges=result.nextEdges;
    run.reward=rewards(run,result.carry,result.gray);
    run.pieces=[...makeTray(run.cards,'card'),...run.pieces.filter(piece=>piece.kind==='enemy'&&!piece.inactive)];
  }
}

function shiftedKeys(keys,dx,dy) {
  return new Set([...keys].map(id=>{
    const [x,y]=id.split(',').map(Number);
    return key(x-dx,y-dy);
  }));
}

function growSmallestCard(run,cards) {
  const rng=generator(run.seed,run.round,5);
  const smallest=Math.min(...cards.map(card=>card.cells.length));
  const card=randomItem(cards.filter(candidate=>candidate.cells.length===smallest),rng);
  const occupied=new Set(card.cells.map(cell=>key(...cell)));
  const {frame,anchor}=cardEditSlot(card);
  const empty=new Map();
  for (const [x,y] of card.cells) for (const [dx,dy] of CARDINAL) {
    const u=x+dx, v=y+dy, id=key(u,v);
    if (occupied.has(id)||!inSlotFrame(frame,anchor.x+u,anchor.y+v)) continue;
    empty.set(id,[u,v]);
  }
  if (!empty.size) return;
  const [u,v]=randomItem([...empty.values()],rng);
  const shiftX=Math.min(0,u), shiftY=Math.min(0,v);
  const eaten=run.eatenNext?.get(card.id);
  if (card.double) card.double=shiftedKeys(card.double,shiftX,shiftY);
  if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,shiftX,shiftY));
  card.cells=normalize([...card.cells,[u,v]]);
  card.slotOffset={x:anchor.x+shiftX-frame.x,y:anchor.y+shiftY-frame.y};
}

function nextRound(run) {
  const {enemies,placements,gray}=run.reward;
  const changes=new Map(placements.map(({card,upgrade})=>[card,upgrade]));
  const cards=run.cards.map(card=>{
    const {localShift,...upgrade}=changes.get(card.id)||{};
    const updated={...card,...upgrade};
    if (localShift) {
      const [dx,dy]=localShift;
      const eaten=run.eatenNext?.get(card.id);
      if (eaten) run.eatenNext.set(card.id,shiftedKeys(eaten,dx,dy));
      if (card.double&&!upgrade.double) updated.double=shiftedKeys(card.double,dx,dy);
    }
    return updated;
  });
  if (gray) growSmallestCard(run,cards);
  let gift=null;
  if (run.round%4===0) {
    const experiment=run.gameMode==='experiment';
    const firstRound=experiment ? EXPERIMENT_START_ROUND : 1;
    let area=experiment ? EXPERIMENT_MAX_CARD_AREA : START_CARD_AREA;
    for (let round=firstRound;round<=run.round;round++) area+=fragmentArea(round,run.gameMode);
    const slot=cards.length;
    const rng=generator(run.seed,run.round,3);
    const cells=rolledShape(area,giftSpan(run.round+1),.58+rng()*.15,rng,false,true);
    gift={id:'p'+slot,slot,cells};
    cards.push(gift);
  }
  run.cards=cards;
  run.round++;
  startBattle(run,enemies);
  return gift;
}

const SAVE_SLOT_COUNT=5, ACTIVE_SAVE_KEY='inhold.activeSlot';
const SEED_RECORDS_KEY='inhold.seedRecords', SEED_RECORD_LIMIT=1000;
const runSaveKey=slot=>'inhold.run.'+slot;
const runProgressKey=slot=>'inhold.progress.'+slot;
const runPositionsKey=slot=>'inhold.positions.'+slot;
const runSummaryKey=slot=>'inhold.summary.'+slot;
const pendingSaves=new Map(), writingSaves=new Map(), saveBases=new Map(), unsavedSlots=new Set();
let activeSaveSlot=0, saveTimer=0, saveTaskQueued=false, saveDb=null, saveUnavailable=false;
const pendingSeedUpdates=[], sessionSeedRecords=[];
let writingSeedRecords=false;

function openSaveDatabase() {
  return new Promise((resolve,reject)=>{
    const name=location.protocol==='file:' ? 'Inhold:'+location.pathname : 'Inhold';
    const request=indexedDB.open(name,1);
    request.onupgradeneeded=()=>request.result.createObjectStore('saves');
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

function saveTransaction(mode,work) {
  return new Promise((resolve,reject)=>{
    const transaction=saveDb.transaction('saves',mode);
    transaction.onabort=()=>reject(transaction.error);
    try {
      const result=work(transaction.objectStore('saves'));
      transaction.oncomplete=()=>resolve(result.map(request=>request.result));
    } catch (error) {
      transaction.abort();
      reject(error);
    }
  });
}

const readSaveValues=keys=>saveTransaction('readonly',store=>keys.map(key=>store.get(key)));
const writeSaveValues=entries=>saveTransaction('readwrite',store=>entries.map(([key,value])=>store.put(value,key)));
function backgroundSave(task) {
  if (typeof requestIdleCallback==='function') requestIdleCallback(task);
  else if (globalThis.scheduler?.postTask) globalThis.scheduler.postTask(task,{priority:'background'});
  else setTimeout(task);
}
function saveMetadata(key,value) {
  if (saveDb) backgroundSave(()=>writeSaveValues([[key,value]]).catch(()=>{saveUnavailable=true;}));
}

function updateSeedRecords(records,{seed,won}) {
  const index=records.findIndex(record=>record.seed===seed);
  if (won&&index>=0) {
    records[index].won=true;
    return;
  }
  const record={seed,won:won||records[index]?.won===true};
  if (index>=0) records.splice(index,1);
  records.unshift(record);
  if (records.length>SEED_RECORD_LIMIT) records.length=SEED_RECORD_LIMIT;
}

async function readSeedRecords() {
  if (!saveDb) return sessionSeedRecords;
  let records=[];
  try {
    const [stored]=await readSaveValues([SEED_RECORDS_KEY]);
    if (Array.isArray(stored)) records=stored;
  } catch {saveUnavailable=true;}
  for (const update of pendingSeedUpdates) updateSeedRecords(records,update);
  return records;
}

async function recordSeed(seed,won=false) {
  const update={seed,won};
  if (!saveDb) {
    updateSeedRecords(sessionSeedRecords,update);
    return;
  }
  pendingSeedUpdates.push(update);
  if (writingSeedRecords) return;
  writingSeedRecords=true;
  try {
    while (pendingSeedUpdates.length) {
      const updates=pendingSeedUpdates.slice();
      await saveTransaction('readwrite',store=>{
        const history=store.get(SEED_RECORDS_KEY);
        history.onsuccess=()=>{
          const records=Array.isArray(history.result)?history.result:[];
          for (const change of updates) updateSeedRecords(records,change);
          store.put(records,SEED_RECORDS_KEY);
        };
        return [history];
      });
      pendingSeedUpdates.splice(0,updates.length);
    }
  } catch {saveUnavailable=true;}
  finally {writingSeedRecords=false;}
}

function migrateSavedRun(state) {
  state.potions=state.potions.map(id=>id==='enemyTurn'?'turn':id);
  for (const tile of [...state.pieces,...(state.reward?.enemies??[]),...(state.nextEnemies??[])]) {
    for (const [cell,id] of tile.pickups??[]) {
      if (id==='enemyTurn') tile.pickups.set(cell,'turn');
    }
    if (tile.openSeams) tile.openSeams=tile.openSeams.filter(([x,y,dx,dy])=>
      solidEnemyCell(tile,key(x,y))&&solidEnemyCell(tile,key(x+dx,y+dy)));
  }
}

function readSavedValue(key) {
  try {
    return JSON.parse(localStorage.getItem(key),(_,value)=>{
      if (Array.isArray(value?.$map)) return new Map(value.$map);
      if (Array.isArray(value?.$set)) return new Set(value.$set);
      return value;
    });
  } catch {
    return null;
  }
}

function placementProgress(state) {
  const positions=state.pieces.filter(piece=>piece.x!==piece.home.x||piece.y!==piece.home.y)
    .map(({id,x,y})=>[id,x,y]);
  if (!state.reward) return {positions};
  const homes=new Map(state.pieces.map(({id,home})=>[id,home]));
  const fragments=state.reward.placements.map(({card,fragment,origin,fragmentCells,upgrade})=>{
    const home=homes.get(card);
    return {card,fragment,offset:[origin[0]-home.x,origin[1]-home.y],fragmentCells,slotOffset:upgrade.slotOffset};
  });
  return {positions,fragments};
}

function restorePlacementProgress(state,progress) {
  const positions=new Map(progress.positions.map(([id,x,y])=>[id,{x,y}]));
  const pieces=state.pieces.map(piece=>{
    const {x,y}=positions.get(piece.id)??piece.home;
    return {...piece,x,y};
  });
  if (!state.reward||!Array.isArray(progress.fragments)) return {...state,pieces};
  const cards=new Map(pieces.map(piece=>[piece.id,piece]));
  const placements=progress.fragments.map(({card,fragment,offset,fragmentCells,slotOffset})=>{
    const target=cards.get(card), origin=[target.home.x+offset[0],target.home.y+offset[1]];
    return {card,fragment,origin,fragmentCells,upgrade:{...fragmentShape(target,origin,fragmentCells),slotOffset}};
  });
  return {...state,pieces,reward:{...state.reward,placements}};
}

async function readRunSave(slot,summary=false) {
  if (pendingSaves.has(slot)) return pendingSaves.get(slot);
  const keys=[runSaveKey(slot),runProgressKey(slot),runPositionsKey(slot)];
  try {
    const stored=saveDb ? await readSaveValues(summary?[runSummaryKey(slot)]:keys) : [];
    if (summary&&stored[0]) return stored[0];
    const native=Boolean(stored[0]);
    const [save,progress,positions]=native?stored:keys.slice(0,summary?2:3).map(readSavedValue);
    if (GAME_MODES.includes(save?.run?.gameMode)&&Array.isArray(save.roundStarts)&&Number.isInteger(save.currentSeed)) {
      if (!native&&!summary) for (const state of [save.run,...save.roundStarts]) migrateSavedRun(state);
      if (typeof save.revision==='string') {
        let layout=save.revision;
        try {
          if (progress?.revision===save.revision&&progress.run?.seed===save.run.seed&&
              progress.run?.gameMode===save.run.gameMode) {
            if (!native&&!summary) migrateSavedRun(progress.run);
            save.run=progress.run;
            layout=typeof progress.layout==='string'?progress.layout:null;
          }
        } catch {}
        if (!summary&&layout) try {
          if (positions?.layout===layout) save.run=restorePlacementProgress(save.run,positions);
        } catch {}
        if (native) saveBases.set(slot,{revision:save.revision,layout,roundStarts:save.roundStarts});
      }
      if (save.run.gameMode==='experiment'&&Number.isInteger(save.run.seed)) save.currentSeed=save.run.seed;
      return save;
    }
    return null;
  } catch {
    saveUnavailable=true;
  }
}

async function writeRunSave(slot,save) {
  const {run:state,currentSeed,roundStarts,checkpoint}=save, base=saveBases.get(slot);
  // The next drag can already be in progress. Save only the committed layout.
  const committed=state===run&&drag ? {...state,pieces:state.pieces.map(piece=>
    piece===drag.piece ? {...piece,x:drag.origin[0],y:drag.origin[1]} : piece)} : state;
  writingSaves.set(slot,save);
  try {
    if (base?.roundStarts===roundStarts&&base.layout&&!checkpoint) {
      await writeSaveValues([[runPositionsKey(slot),{layout:base.layout,...placementProgress(committed)}]]);
    } else {
      const layout=Date.now().toString(36)+'-'+seedValue().toString(36);
      const {gameMode,round,phase}=committed;
      const summary=[runSummaryKey(slot),{currentSeed,run:{gameMode,round,phase}}];
      const revision=base?.roundStarts===roundStarts ? base.revision : layout;
      const update=revision===layout
        ? [runSaveKey(slot),{currentSeed,run:committed,roundStarts,revision}]
        : [runProgressKey(slot),{revision,layout,run:committed}];
      await writeSaveValues([update,summary]);
      saveBases.set(slot,{revision,layout,roundStarts});
    }
    if (pendingSaves.get(slot)===save) pendingSaves.delete(slot);
    unsavedSlots.delete(slot);
  } catch {
    unsavedSlots.add(slot);
    const pending=pendingSaves.get(slot);
    if (pending===save) pendingSaves.set(slot,{...save,run:committed,due:Infinity});
    else if (checkpoint&&pending) pending.checkpoint=true;
  } finally {
    writingSaves.delete(slot);
    if (document.hidden) flushRunSaves(true);
    else scheduleRunSave();
  }
}

function flushRunSaves(leaving=false) {
  if (!saveDb) return;
  const now=performance.now();
  for (const [slot,save] of pendingSaves) {
    if (!writingSaves.has(slot)&&Number.isFinite(save.due)&&(leaving||save.due<=now)) writeRunSave(slot,save);
  }
  scheduleRunSave();
}

function scheduleRunSave() {
  clearTimeout(saveTimer);
  if (!saveDb||saveTaskQueued) return;
  let due=Infinity;
  for (const [slot,save] of pendingSaves) if (!writingSaves.has(slot)) due=Math.min(due,save.due);
  if (due<Infinity) saveTimer=setTimeout(()=>{
    saveTaskQueued=true;
    backgroundSave(()=>{
      saveTaskQueued=false;
      flushRunSaves();
    });
  },Math.max(0,Math.ceil(due-performance.now())));
}

function stageRunSave(checkpoint=false) {
  const slot=activeSaveSlot, previous=pendingSaves.get(slot);
  const full=checkpoint||Boolean(previous?.checkpoint&&previous!==writingSaves.get(slot));
  pendingSaves.set(slot,{currentSeed,run,roundStarts,checkpoint:full,due:checkpoint?0:performance.now()+100});
  scheduleRunSave();
}

function saveRun() {stageRunSave(true);}

window.addEventListener('pagehide',()=>flushRunSaves(true));
document.addEventListener('visibilitychange',()=>{if (document.hidden) flushRunSaves(true);});

function selectSaveSlot(slot) {
  const outgoing=pendingSaves.get(activeSaveSlot);
  if (slot!==activeSaveSlot&&outgoing&&outgoing!==writingSaves.get(activeSaveSlot)) outgoing.due=0;
  activeSaveSlot=slot;
  saveMetadata(ACTIVE_SAVE_KEY,slot);
  scheduleRunSave();
}

const frame=$('frame'), canvas=$('board'), ctx=canvas.getContext('2d');

function dissolveStrip(color,cellPixels,{hollow=false}={}) {

    paint.fillStyle=color;

    const pixels=paint.getImageData(0,0,strip.width,strip.height);
    const rng=generator(cellPixels,0,0);
    const rim=hollow ? hollowBorderPixels(cellPixels) : 0;
    const innerEnd=cellPixels-rim;
    for (let variant=0;variant<DISSOLVE_PATTERNS;variant++) {
      const order=Array.from({length:cellPixels*cellPixels},(_,index)=>index);
      for (let i=order.length-1;i>0;i--) {
        const j=rangeInt(0,i,rng);

      }
      for (const [index,pixel] of order.entries()) {
        const column=pixel%cellPixels;
        const cellRow=Math.floor(pixel/cellPixels);
        const row=variant*cellPixels+cellRow;
        const inCenter=hollow&&column>=rim&&column<innerEnd&&cellRow>=rim&&cellRow<innerEnd;
        const firstEmpty=inCenter ? 0 : Math.ceil((index+1)*(DISSOLVE_FRAME_COUNT-1)/order.length);
        for (let frame=firstEmpty;frame<DISSOLVE_FRAME_COUNT;frame++) {
          pixels.data[(row*strip.width+frame*cellPixels+column)*4+3]=0;
        }

    paint.putImageData(pixels,0,0);

  }
  return strip;
}

  const side=clamp(Math.round(size*pixelRatio),1,cellPixels);

function joinedCellRects(size,fill) {

  const trimTop=inset>0&&(fill.cutTopLeft||fill.cutTopRight);
  const trimBottom=inset>0&&(fill.cutBottomLeft||fill.cutBottomRight);
  const top=fill.top&&!trimTop?0:inset, bottom=fill.bottom&&!trimBottom?size:size-inset;
  const rects=[[left,top,right-left,bottom-top]];

function draw(fade=null) {

    const ink=enemyPaint[current.remainingTypes.get(id)]??enemyPaint.normal;
    const joinedFill=current.visibleJoined.get(id);
    const draggedType=draggedCells.get(id);
    const partial=!showingSettlement&&(absorbed||current.partialJoined.has(id));
    const tint=partial ? (mode==='enemy'?'partialEnemy':'partialCard') : 'base';
    const color=ink[tint];

  for (const host of new Set(scrollports.map(({host})=>host))) {
    changes.observe(host,{subtree:true,childList:true,attributes:true,
      attributeFilter:['hidden','open','data-topic','data-layout','data-rows','data-side','data-scout','data-phase']});
  }
  document.addEventListener('scroll',schedule,{capture:true,passive:true});
  document.fonts.ready.then(schedule);
  schedule();
  return schedule;
}
canvas.addEventListener('pointermove',event=>{
  if (potionChoice?.edit?.drag?.pointer===event.pointerId) {
    if (moveExchangePart(event)) scheduleDragDraw();
    return;
  }
  if (potionChoice?.overlapDrag?.pointer===event.pointerId) {
    if (moveOverlapDrag(event)) scheduleDragDraw();
    return;
  }
  if (potionChoice?.cutPointer===event.pointerId) {
    const piece=cutTarget();
    if (piece) {
      const [x,y]=point(event,canvas,unit);
      moveCutLineAt(piece,x,y,true);
    }
    return;
  }
  if (!drag) return;
  if (event.pointerId!==drag.id) return;
  if (moveDraggedPiece(point(event,canvas,unit))) scheduleDragDraw(true);
});
function moveDraggedPiece([x,y]) {
  const dx=Math.round(x-drag.pointer[0]),dy=Math.round(y-drag.pointer[1]);
  if (!dx&&!dy&&!drag.moved) return false;
  const oldX=drag.piece.x,oldY=drag.piece.y;
  movePiece(drag.piece,drag.origin[0]+dx,drag.origin[1]+dy,drag.shape);
  if (oldX===drag.piece.x&&oldY===drag.piece.y) return false;
  drag.moved=true;
  return true;
}
function release(event) {
  if (potionChoice?.edit?.drag?.pointer===event.pointerId) {
    releaseExchangePart(event);
    return;
  }
  if (potionChoice?.overlapDrag?.pointer===event.pointerId) {
    releaseOverlapDrag(event);
    return;
  }
  if (potionChoice?.cutPointer===event.pointerId) {
    const piece=cutTarget();
    if (piece&&event.type==='pointerup') {
      const [x,y]=point(event,canvas,unit);
      moveCutLineAt(piece,x,y,true);
    }
    delete potionChoice.cutPointer;
    if (dragDrawFrame) refresh();
    return;
  }
  if (!drag || event.pointerId!==drag.id) return;
  const dropped=event.type==='pointerup';
  if (dropped) moveDraggedPiece(point(event,canvas,unit));
  const {piece,prior,candidates,origin,moved}=drag;
  drag=null;
  if (!dropped) {
    movePiece(piece,...origin);
  } else if (!moved&&prior===piece.id&&candidates.length>1) {
    const index=candidates.indexOf(piece);
    selected=candidates[(index+candidates.length-1)%candidates.length].id;
  }
  if (!active(piece)) returnToSlot(piece);
  refresh();
  if (dropped&&(piece.x!==origin[0]||piece.y!==origin[1])) stageRunSave();
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
canvas.addEventListener('lostpointercapture',release);
canvas.addEventListener('wheel',event=>{
  if (locked||drag||upgradeDrag||$('info').open||!event.deltaY) return;
  const [x]=point(event,canvas,unit);
  if (x>=FIELD.x) return;
  const offset=clamp(trayOffset-3*Math.sign(event.deltaY),minTrayOffset,maxTrayOffset);
  if (offset===trayOffset) return;
  event.preventDefault();
  positionTrays(offset);
  refresh();
},{passive:false});

canvas.addEventListener('keydown',event=>{
  if (!battleReady()||drag||potionChoice?.edit) return;
  if (potionKey(event)) return;
  if (event.key==='1'||event.key==='2') {
    setMode(event.key==='1'?'card':'enemy');
    refresh();
    return;
  }
  const piece=run.pieces.find(p=>p.id===selected);
  if (!piece||piece.banned||piece.inactive) return;
  const moves={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if (moves[event.key]) {
    event.preventDefault();
    const {x,y}=piece;
    const [dx,dy]=moves[event.key];
    movePiece(piece,x+dx,y+dy);
    if (!active(piece)) returnToSlot(piece);
    refresh();
    if (piece.x!==x||piece.y!==y) stageRunSave();
  }
});

function showInfo(title,content,buttons) {
  hideHoverTip();
  const target=$('info');
  target.dataset.topic=title;
  $('info-title').textContent=message(title);
  const dismiss=buttons.find(([text])=>text==='close'||text==='keepPlaying');
  const closeButton=$('info-close');
  closeButton.hidden=!dismiss;
  if (dismiss) {
    const [text,action]=dismiss;
    closeButton.setAttribute('aria-label',message(text));
    closeButton.onclick=()=>{target.close();action?.();};
  }
  $('info-body').replaceChildren(...content.map(item=>{
    if (typeof item!=='string') return item;
    const p=document.createElement('p');p.textContent=item;return p;
  }));
  const footer=buttons.filter(button=>button!==dismiss);
  $('info-actions').replaceChildren(...footer.map(([text,action],i)=>{
    const button=document.createElement('button');
    button.className=i===footer.length-1?'action':'quiet';
    button.textContent=message(text);button.onclick=()=>{target.close();action?.();};return button;
  }));
  if (!target.open) target.showModal();
}
$('help').onclick=()=>showInfo('help',battleHelpParagraphs(),[['close']]);
$('potion-guide').onclick=()=>{
  const list=document.createElement('ul');
  list.className='potion-guide';
  for (const [id,potion] of Object.entries(POTIONS)) {
    const [name,description]=potion[gearLanguage()];
    const item=document.createElement('li');
    const icon=createPotionIcon(id,GUIDE_ICON_PIXELS);
    const text=document.createElement('div');
    const title=document.createElement('h3');
    title.textContent=name;
    const detail=document.createElement('p');
    detail.textContent=description;
    text.append(title,detail);
    item.append(icon,text);
    list.append(item);
  }
  showInfo('potionGuide',[list],[['close']]);
  $('info-body').scrollTop=0;
  snapPotionIcons(list);
};
function showRun(next) {
  cancelAnimationFrame(frameAnimation);
  clearTimeout(giftTimer);
  showLimitHint=false;
  displayedHp=null;
  frameAnimation=0;locked=false;drag=null;selected=null;giftNotice=0;
  upgradeDrag=null;trayOffset=maxTrayOffset;
  delete frame.dataset.sideFlash;
  setMode('');
  discardPotion(false);
  gearStamp='';
  run=next;
  resize();
}
function beginRun(seed,gameMode,slot=activeSaveSlot) {
  const next=newRun(seed,gameMode);
  currentSeed=next.seed;
  roundStarts=[structuredClone(next)];
  showRun(next);
  rememberSeed(currentSeed);
  recordSeed(next.seed);
  if (slot!==activeSaveSlot) selectSaveSlot(slot);
  saveRun();
}
function undoRoundStart() {
  const start=roundStarts.at(-1);
  if (!start||run.phase!=='battle') return start;
  const usedItem=run.potions.length!==start.potions.length;
  const movedPiece=run.pieces.some(piece=>piece.x!==piece.home.x||piece.y!==piece.home.y);
  return usedItem||movedPiece ? start : roundStarts.at(-2);
}
function showUndoRound() {
  const start=undoRoundStart();
  if (!start||locked||drag||upgradeDrag) return;
  showInfo('undoRound',[message('undoRoundPrompt',start.round)],[['keepPlaying'],['confirm',()=>{
    const restored=structuredClone(start);
    if (start!==roundStarts.at(-1)) roundStarts=roundStarts.slice(0,-1);
    showRun(restored);
    saveRun();
    canvas.focus({preventScroll:true});
  }]]);
}
$('undo-round').onclick=showUndoRound;

const SEED_ALPHABET='0123456789ABCDEFGHJKMNPQRSTVWXYZ';

function seedName(seed) {
  const name=document.createElement('span');
  name.className='seed-name';
  const parts=[seed>>>21,(seed>>>11)&0x3ff,seed&0x7ff];
  if (language==='en') {
    const groups=parts.map((part,index)=>{
      const digits=part.toString(32).padStart(index===1?2:3,'0');
      return Array.from(digits,digit=>SEED_ALPHABET[parseInt(digit,32)]).join('');
    });
    name.textContent=groups.join('·');
  } else {
    name.lang='zh-CN';
    name.textContent=parts.map(part=>SEED_WORDS[part]).join('·');
  }
  return name;
}

function parseSeedName(text) {
  const code=text.replace(/[\s·]/g,'');
  let parts;
  if (code.length===6) {
    const words=[code.slice(0,2),code.slice(2,4),code.slice(4)];
    parts=words.map(word=>SEED_WORDS.indexOf(word));
  } else if (/^[0-9a-z]{8}$/i.test(code)) {
    const groups=[code.slice(0,3),code.slice(3,5),code.slice(5)];
    parts=groups.map(group=>{
      let part=0;
      for (const char of group.toUpperCase()) {
        const digit=SEED_ALPHABET.indexOf(char);
        if (digit<0) return -1;
        part=part*32+digit;
      }
      return part;
    });
  } else {
    return null;
  }
  const [first,second,third]=parts;
  if (first<0||first>=2048||second<0||second>=1024||third<0||third>=2048) return null;
  return ((first<<21)|(second<<11)|third)>>>0;
}

function restartOption(group,value,text,checked=false) {
  const row=document.createElement('label');
  row.className='restart-choice';
  const choice=document.createElement('input');
  choice.type='radio';
  choice.name=group;
  choice.value=value;
  choice.checked=checked;
  row.append(choice,text);
  return row;
}

function showSeedRecords(records,returnToRestart) {
  const list=document.createElement('ul');
  list.className='seed-records';
  list.tabIndex=0;
  list.hidden=!records.length;
  for (const {seed,won} of records) {
    const item=document.createElement('li');
    item.append(seedName(seed));
    if (won) {
      const mark=document.createElement('span');
      mark.className='seed-win';
      mark.setAttribute('role','img');
      mark.setAttribute('aria-label',message('seedWon'));
      item.append(mark);
    }
    list.append(item);
  }
  showInfo('seedRecords',[list],[['close']]);
  $('info-body').scrollTop=0;
  const closeButton=$('info-close');
  closeButton.onclick=returnToRestart;
  closeButton.focus({preventScroll:true});
}

$('info').addEventListener('cancel',event=>{
  if (event.currentTarget.dataset.topic!=='seedRecords') return;
  event.preventDefault();
  $('info-close').click();
});

async function showSaveSlots() {
  const dialog=$('info');
  if (locked||drag||upgradeDrag||dialog.open) return;
  const state=run, activeSlot=activeSaveSlot;
  const saves=await Promise.all(Array.from({length:SAVE_SLOT_COUNT},(_,slot)=>
    slot===activeSlot ? {run:state,currentSeed} : readRunSave(slot,true)));
  if (run!==state||activeSaveSlot!==activeSlot||locked||drag||upgradeDrag||dialog.open) return;
  const list=document.createElement('div');
  list.className='save-slots';
  for (let slot=0;slot<SAVE_SLOT_COUNT;slot++) {
    const current=slot===activeSaveSlot;
    const save=saves[slot];
    const row=document.createElement('button');
    row.type='button';
    row.className='save-slot';
    row.disabled=save===undefined;
    const name=document.createElement('span'), progress=document.createElement('span');
    name.textContent=message('saveSlot',slot+1);
    if (current) row.setAttribute('aria-current','true');
    if (save) {
      const {gameMode,round,phase}=save.run;
      const stage=phase==='won'||phase==='lost'?message('endedSlot'):gearRound(round);
      progress.textContent=message(gameMode)+' · '+stage;
    } else progress.textContent=message('emptySlot');
    row.append(name,progress);
    if (save) {
      const seed=seedName(save.currentSeed);
      if (save.run.gameMode==='experiment') seed.style.visibility='hidden';
      row.append(seed);
    }
    row.onclick=async ()=>{
      if (!current) {
        list.inert=true;
        const next=await readRunSave(slot);
        if (!dialog.open||!list.isConnected) return;
        if (next===undefined) {
          row.disabled=true;
          list.inert=false;
          return;
        }
        dialog.close();
        if (next) {
          selectSaveSlot(slot);
          currentSeed=next.currentSeed;
          roundStarts=next.roundStarts;
          showRun(next.run);
          if (!saveBases.get(slot)?.layout||unsavedSlots.has(slot)) saveRun();
          terminal();
        } else beginRun(currentSeed,run.gameMode,slot);
      } else dialog.close();
      if (!dialog.open) canvas.focus({preventScroll:true});
    };
    list.append(row);
  }
  const content=[list];
  if (saveUnavailable||unsavedSlots.size) content.push(message('saveUnavailable'));
  showInfo('saveSlots',content,[['close']]);
  $('info-body').scrollTop=0;
}

function showRestart() {
  if (locked||drag||upgradeDrag) return;
  const openingMode=document.createElement('fieldset');
  openingMode.className='opening-mode';
  openingMode.setAttribute('aria-label',message('openingMode'));
  openingMode.append(...GAME_MODES.map(gameMode=>
    restartOption('restart-mode',gameMode,message(gameMode),gameMode===run.gameMode)));

  const {entries:history}=recentSeeds;
  let selectedSeed=currentSeed;
  const seedPreview=document.createElement('output');
  seedPreview.append(seedName(selectedSeed));

  const options=document.createElement('fieldset');
  options.className='seed-choices';
  options.setAttribute('aria-label',message('recentSeeds'));
  const seedHistory=document.createElement('div');
  seedHistory.className='seed-history';
  seedHistory.append(...history.map(({seed,favorite})=>{
    const row=restartOption('restart-seed',String(seed),seedName(seed),seed===currentSeed);
    row.insertAdjacentHTML('beforeend',`<svg class="seed-favorite" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
      <path d="M4 0h2v2H4z M2 2h2v2H2z M6 2h2v2H6z M0 4h2v2H0z M8 4h2v2H8z M2 6h2v2H2z M6 6h2v2H6z M4 8h2v2H4z"/>
    </svg>`);
    row.toggleAttribute('data-favorite',favorite);
    return row;
  }));
  const selectSeed=seed=>{
    if (seed===selectedSeed) return;
    const selected=seedHistory.querySelector('input[type="radio"]:checked');
    if (selected && Number(selected.value)!==seed) selected.checked=false;
    selectedSeed=seed;
    seedPreview.replaceChildren(seedName(seed));
  };
  let editingFavorites=false;
  seedHistory.onchange=({target:choice})=>{
    const seed=Number(choice.value);
    if (!editingFavorites) {
      selectSeed(seed);
      return;
    }
    const row=choice.parentElement;
    if (setSeedFavorite(seed,choice.checked)) row.toggleAttribute('data-favorite',choice.checked);
    else choice.checked=row.hasAttribute('data-favorite');
  };
  const editFavorites=document.createElement('button');
  editFavorites.type='button';
  editFavorites.className='quiet edit-favorites';
  editFavorites.textContent=message('editFavorites');
  editFavorites.onclick=()=>{
    editingFavorites=!editingFavorites;
    editFavorites.textContent=message(editingFavorites?'done':'editFavorites');
    for (const choice of seedHistory.querySelectorAll('input')) {
      choice.checked=false;
      choice.type=editingFavorites?'checkbox':'radio';
      choice.checked=editingFavorites?choice.parentElement.hasAttribute('data-favorite'):Number(choice.value)===selectedSeed;
    }
  };
  const rollSeed=document.createElement('button');
  rollSeed.type='button';
  rollSeed.className='quiet';
  rollSeed.textContent=message('randomSeed');
  rollSeed.onclick=()=>selectSeed(seedValue());
  const openingSeeds=document.createElement('dl');
  openingSeeds.className='opening-seeds';
  const currentLabel=document.createElement('dt');
  currentLabel.textContent=message('currentSeed');
  const currentValue=document.createElement('dd');
  currentValue.append(seedName(currentSeed));
  const nextLabel=document.createElement('dt');
  nextLabel.textContent=message('nextSeed');
  const nextValue=document.createElement('dd');
  nextValue.append(seedPreview,rollSeed);
  const seedInput=document.createElement('input');
  seedInput.id='restart-seed-input';
  seedInput.className='seed-input';
  seedInput.maxLength=10;
  seedInput.autocomplete='off';
  seedInput.spellcheck=false;
  const confirmSeed=document.createElement('button');
  confirmSeed.type='button';
  confirmSeed.className='quiet';
  confirmSeed.textContent=message('confirm');
  confirmSeed.onclick=()=>{
    const seed=parseSeedName(seedInput.value);
    if (seed!==null) selectSeed(seed);
  };
  seedInput.onkeydown=event=>{
    if (event.key==='Enter'&&!event.isComposing) confirmSeed.click();
  };
  const seedInputLabel=document.createElement('label');
  seedInputLabel.htmlFor=seedInput.id;
  seedInputLabel.textContent=message('enterSeed');
  const inputTerm=document.createElement('dt');
  inputTerm.append(seedInputLabel);
  const inputValue=document.createElement('dd');
  inputValue.append(seedInput,confirmSeed);
  openingSeeds.append(currentLabel,currentValue,nextLabel,nextValue,inputTerm,inputValue);
  options.append(seedHistory);
  const seedRecordsButton=document.createElement('button');
  seedRecordsButton.type='button';
  seedRecordsButton.className='quiet restart-records';
  seedRecordsButton.textContent=message('seedRecords');
  seedRecordsButton.setAttribute('aria-haspopup','dialog');
  const showRestartPanel=(scrollTop=0)=>{
    showInfo('restartTitle',[openingMode,openingSeeds,options],[['keepPlaying'],['restartSlot',()=>{
      const gameMode=openingMode.querySelector('input:checked').value;
      beginRun(selectedSeed,gameMode);
    }]]);
    $('info-actions').prepend(editFavorites,seedRecordsButton);
    $('info-body').scrollTop=scrollTop;
  };
  seedRecordsButton.onclick=async ()=>{
    const dialog=$('info');
    const records=await readSeedRecords();
    if (!dialog.open||!seedRecordsButton.isConnected) return;
    const scrollTop=$('info-body').scrollTop;
    showSeedRecords(records,()=>{
      showRestartPanel(scrollTop);
      seedRecordsButton.focus({preventScroll:true});
    });
  };
  showRestartPanel();
}
$('save-slots').onclick=showSaveSlots;
$('reset').onclick=showRestart;

function terminal() {
  if (!['won','lost'].includes(run.phase)) return;
  const won=run.phase==='won';
  showInfo(won?'won':'lost',[won?message('remainingLife',run.hp):message('reachedRound',run.round)],
    [['viewBattlefield'],['undoRound',showUndoRound],['newRun',showRestart]]);
  $('info').addEventListener('close',refresh,{once:true});
}
function runSettlement() {
  if (!battleReady()||drag||potionChoice) return;
  if (deployment(run).overLimit) {
    showLimitHint=true;
    updateStatus();
    return;
  }
  locked=true;updateStatus();
  const result=settlement(run);
  const lifeLoss=Math.min(run.hp,result.damage);
  const completed=()=>{
    locked=false;frameAnimation=0;selected=null;
    displayedHp=null;
    finishBattle(run,result);
    if (run.phase==='won') recordSeed(run.seed,true);
    saveRun();
    if (run.phase==='reward') openUpgrade();
    else {
      terminal();
      refresh();
    }
  };
  const unresolvedHollows=[];
  for (const [id,resolved] of result.hollows) if (!resolved) unresolvedHollows.push(id);
  const pendingDamage=result.uncovered.size||unresolvedHollows.length;
  if (reduced.matches||(!result.shield.size&&!pendingDamage)) {completed();return;}
  const dissolveMs=300;
  const redDelayMs=pendingDamage ? 200 : 0;
  const duration=dissolveMs+redDelayMs;
  const ids=new Set([...result.shield,...result.uncovered.keys(),...unresolvedHollows]);
  const patterns=new Map([...ids].map(id=>[id,rangeInt(0,DISSOLVE_PATTERNS-1,Math.random)]));
  const cellPixels=Math.round(unit*pixelRatio);
  if (result.shield.size) dissolveStrip(boardColors.card,cellPixels);
  if (result.uncovered.size) {
    dissolveStrip(boardColors.enemy,cellPixels);
    if ([...result.visibleJoined.keys()].some(id=>result.uncovered.has(id))) dissolveStrip(joinedEnemyPaint.base,cellPixels);
    if ([...result.uncovered.values()].some(layers=>layers>1)) dissolveStrip(stackMarkColors.base,cellPixels);
  }
  if (unresolvedHollows.length) dissolveStrip(boardColors.enemy,cellPixels,{hollow:true});
  const start=performance.now();
  function tick(now) {
    const elapsed=now-start;
    if (elapsed>=duration) {completed();return;}
    const blackProgress=clamp(elapsed/dissolveMs,0,1);
    const redElapsed=elapsed-redDelayMs;
    const redProgress=clamp(redElapsed/dissolveMs,0,1);
    if (lifeLoss&&redElapsed>=0) {
      displayedHp=run.hp-Math.floor(lifeLoss*clamp(redElapsed/150,0,1));
      updateLife();
    }
    draw({result,patterns,blackProgress,redProgress});
    frameAnimation=requestAnimationFrame(tick);
  }
  frameAnimation=requestAnimationFrame(tick);
}
$('settle').onclick=runSettlement;

function fragmentThumbnail(cells,left,top,held) {
  const thumb=document.createElement('canvas');
  cursorCells.set(thumb,new Set());
  const side=Math.round(FRAGMENT_TILE_SPAN*unit*pixelRatio);
  thumb.width=side;thumb.height=side;thumb.setAttribute('aria-hidden','true');
  const context=thumb.getContext('2d');
  context.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  context.fillStyle=dragColor(upgradeColors.fragment,held);
  for (const [x,y] of cells) square(context,left+x,top+y,unit,pixelRatio);
  return thumb;
}
function upgradeCardAt(x,y) {
  return run.pieces.find(piece=>piece.kind==='card'&&inSlotFrame(slotOrigin(piece.slot,false,trayOffset),x,y));
}
function cardPlacement(id) {return run.reward.placements.find(placement=>placement.card===id);}
function fragmentOptionOffset(cells) {
  const {w,h}=bounds(cells);
  return [Math.floor((FRAGMENT_TILE_SPAN-w)/2),Math.floor((FRAGMENT_TILE_SPAN-h)/2)];
}
function fragmentGrabAt(event,x,y) {
  const margins=[];
  for (const {fragment,origin,fragmentCells} of run.reward.placements) {
    const grip=[Math.floor(x)-origin[0],Math.floor(y)-origin[1]];
    if (hitCell(fragmentCells,...grip)) return {fragment,grip};
    if (hitCellMargin(fragmentCells,...grip)) margins.push({fragment,grip});
  }
  for (const [fragment,button] of Array.from($('fragments').children).entries()) {
    const cells=run.reward.fragments[fragment];
    const [left,top]=fragmentOptionOffset(cells);
    const [column,row]=point(event,button,unit).map(Math.floor);
    const grip=[column-left,row-top];
    const target={fragment,grip,fromOptions:true};
    if (hitCell(cells,...grip)) return target;
    if (hitCellMargin(cells,...grip)) margins.push(target);
  }
  return margins.length===1?margins[0]:null;
}
function grabUpgradeFragment(event) {
  if (upgradeDrag||$('info').open) return;
  if (event.target===canvas) {
    event.preventDefault();
    if (potionChoice) {discardPotion();return;}
  }
  const target=fragmentGrabAt(event,...point(event,canvas,unit));
  if (target) startFragmentDrag(event,target.fragment,target.grip,target.fromOptions);
}
function openUpgrade() {
  upgradeDrag=null;
  for (const piece of run.pieces) if (piece.kind==='card') returnToSlot(piece);
  resize();
}
function paintUpgradeOptions() {
  const list=$('fragments');
  const usedFragments=new Set(run.reward.placements.map(placement=>placement.fragment));
  list.replaceChildren(...run.reward.fragments.map((cells,index)=>{
    const [left,top]=fragmentOptionOffset(cells);
    const used=usedFragments.has(index);
    const button=document.createElement('button');
    button.type='button';button.className='choice';button.tabIndex=-1;
    button.setAttribute('aria-label',message('fragmentLabel',used));
    button.classList.toggle('used',used);
    button.append(fragmentThumbnail(cells,left,top,upgradeDrag?.fromOptions&&upgradeDrag.fragment===index));
    return button;
  }));
  refresh();
}

function startFragmentDrag(event,fragment,grip,fromOptions=false) {
  if (event.button!==0||run.phase!=='reward'||upgradeDrag||$('info').open) return;
  event.preventDefault();
  const start=point(event,canvas,unit).map(Math.floor);
  const cells=run.reward.fragments[fragment];
  upgradeDrag={id:event.pointerId,fragment,cells,grip,start,point:start,box:boardBox,fromOptions,moved:false};
  frame.setPointerCapture(event.pointerId);
  if (fromOptions) paintUpgradeOptions();
  else refresh();
}
function moveFragmentDrag(event,force=false) {
  const [x,y]=point(event,canvas,unit).map(Math.floor);
  const {start,grip,fragment,cells,point:last,box}=upgradeDrag;
  if (!force&&box===boardBox&&x===last[0]&&y===last[1]) return false;
  if (x!==start[0]||y!==start[1]) upgradeDrag.moved=true;
  const origin=[x-grip[0],y-grip[1]];
  const overlapping=cells.map(([u,v])=>upgradeCardAt(origin[0]+u,origin[1]+v)).filter(Boolean);
  const underPointer=upgradeCardAt(x,y);
  const card=overlapping.includes(underPointer)?underPointer:overlapping[0];
  const proposal=card&&upgradePlacement(card,fragment,origin,cells);
  Object.assign(upgradeDrag,{card,origin,proposal,point:[x,y],box:boardBox});
  return true;
}
frame.addEventListener('pointermove',event=>{
  if (upgradeDrag?.id!==event.pointerId) return;
  if (moveFragmentDrag(event)) scheduleDragDraw(true);
});
function releaseFragment(event) {
  if (upgradeDrag?.id!==event.pointerId) return;
  const dropped=event.type==='pointerup';
  if (dropped) moveFragmentDrag(event,true);
  const {fragment,moved,card,origin,proposal,fromOptions}=upgradeDrag;
  upgradeDrag=null;
  let changed=false;
  if (dropped&&moved) {
    if (proposal?.valid) {
      placeUpgradeFragment(card,fragment,origin,proposal.clipped);
      changed=true;
    } else if (!proposal?.clipped.length) {
      const kept=run.reward.placements.filter(item=>item.fragment!==fragment);
      changed=kept.length!==run.reward.placements.length;
      if (changed) run.reward.placements=kept;
    }
  }
  if (fromOptions||changed) paintUpgradeOptions();
  else refresh();
  if (changed) stageRunSave();
}
frame.addEventListener('pointerup',releaseFragment);
frame.addEventListener('pointercancel',releaseFragment);
frame.addEventListener('lostpointercapture',releaseFragment);
document.addEventListener('pointermove',updateGrabCursor,true);
for (const type of ['pointerdown','pointerup']) document.addEventListener(type,updateGrabCursor);
const resetGrabCursor=()=>setGrabVariant(-1);
cursorRoot.addEventListener('pointerleave',resetGrabCursor);
document.addEventListener('pointercancel',resetGrabCursor);
window.addEventListener('blur',resetGrabCursor);

function upgradePlacement(card,index,[x,y],cells) {
  const slot=slotOrigin(card.slot,false,trayOffset);
  const placed=cardPlacement(card.id);
  const occupied=Boolean(placed&&placed.fragment!==index);
  const clipped=cells.filter(([u,v])=>{
    const xx=x+u, yy=y+v;
    return xx>=viewLeft&&xx<viewRight&&yy>=0&&yy<HEIGHT&&inSlotFrame(slot,xx,yy);
  });
  return {valid:clipped.length>0&&!occupied,occupied,clipped};
}
function fragmentShape(card,origin,fragmentCells) {
  const [x,y]=origin;
  const patch=fragmentCells.map(([u,v])=>[x-card.x+u,y-card.y+v]);
  const combined=card.cells.concat(patch);
  const cells=normalize(combined);
  const localShift=[Math.min(...combined.map(([u])=>u)),Math.min(...combined.map(([,v])=>v))];
  return {cells,localShift};
}

function placeUpgradeFragment(card,index,origin,fragmentCells) {
  const [x,y]=origin;
  const slot=slotOrigin(card.slot,false,trayOffset);
  const slotOffset={
    x:Math.min(card.x,...fragmentCells.map(([u])=>x+u))-slot.x,
    y:Math.min(card.y,...fragmentCells.map(([,v])=>y+v))-slot.y
  };
  const placements=run.reward.placements.filter(item=>item.fragment!==index);
  placements.push({card:card.id,fragment:index,origin,fragmentCells,upgrade:{...fragmentShape(card,origin,fragmentCells),slotOffset}});
  run.reward.placements=placements;
}
function drawUpgradeFragment(card,cells,[x,y],held=false) {
  const occupied=!held&&card&&cellKeys(card.cells);
  const color=dragColor(upgradeColors.fragment,held);
  for (const [u,v] of cells) {
    const xx=x+u, yy=y+v;
    const overlap=occupied&&occupied.has(key(xx-card.x,yy-card.y));
    ctx.fillStyle=overlap ? upgradeColors.overlap : color;
    square(ctx,xx,yy,unit,pixelRatio);
  }
}
function drawUpgrade() {
  drawUpcomingEnemies();

  const moving=upgradeDrag?.moved ? upgradeDrag : null;
  for (const placement of run.reward.placements) {
    if (placement.fragment===moving?.fragment) continue;
    const target=run.pieces.find(piece=>piece.id===placement.card);
    const held=placement.fragment===upgradeDrag?.fragment&&!upgradeDrag.fromOptions;
    drawUpgradeFragment(target,placement.fragmentCells,placement.origin,held);
  }
  if (moving) {
    const {cells,origin,proposal}=moving;
    drawUpgradeFragment(null,proposal?.clipped??cells,origin,true);
  }
  for (const piece of run.pieces) {
    if (piece.kind==='card') drawSlotFrame(slotOrigin(piece.slot,false,trayOffset));
  }
}
function drawSlotFrame({x,y}) {
  const side=MAX_PIECE_SPAN*unit;
  ctx.strokeStyle='#a4a4a4';
  ctx.lineWidth=1/pixelRatio;
  ctx.strokeRect(x*unit,y*unit,side,side);
}
function upgradeHint() {
  if (upgradeDrag?.proposal?.occupied) {
    return message('occupiedSlot');
  }
  return message('upgradeHint');
}
$('advance').onclick=()=>{
  if (run.phase!=='reward') return;
  discardPotion(false);
  upgradeDrag=null;
  selected=null;giftNotice=0;
  setMode('');
  const gift=nextRound(run);
  roundStarts=[...roundStarts,structuredClone(run)];
  saveRun();
  if (gift) announceGift(gift.cells.length);
  resize();
  canvas.focus({preventScroll:true});
};
$('info-body').addEventListener('scroll',()=>{
  const list=$('info-body').querySelector('.potion-guide');
  if (list) snapPotionIcons(list);
},{passive:true});
async function startGame() {
  saveDb=await openSaveDatabase().catch(()=>null);
  saveUnavailable=!saveDb;
  let storedSlot,storedSeeds;
  try {
    if (saveDb) [storedSlot,storedSeeds]=await readSaveValues([ACTIVE_SAVE_KEY,SEED_HISTORY_KEY]);
  } catch {saveUnavailable=true;saveDb=null;}
  const lastSlot=storedSlot??readSavedValue(ACTIVE_SAVE_KEY);
  if (Number.isInteger(lastSlot)&&lastSlot>=0&&lastSlot<SAVE_SLOT_COUNT) activeSaveSlot=lastSlot;
  recentSeeds=loadSeedHistory(storedSeeds);
  let loadedSave;
  for (const slot of new Set([activeSaveSlot,0])) {
    activeSaveSlot=slot;
    loadedSave=await readRunSave(slot);
    if (loadedSave===undefined) {
      saveDb=null;
      loadedSave=await readRunSave(slot);
    }
    if (loadedSave) break;
  }
  const {currentSeed:savedSeed}=recentSeeds;
  currentSeed=loadedSave?.currentSeed??savedSeed??seedValue();
  run=loadedSave?.run??newRun(currentSeed);
  roundStarts=loadedSave?.roundStarts??[structuredClone(run)];
  if (!loadedSave) {
    if (savedSeed===undefined) rememberSeed(currentSeed);
    recordSeed(run.seed);
  }
  window.addEventListener('resize',resize);
  window.addEventListener('scroll',()=>{boardBox=gameRect(canvas);},{passive:true});
  updateScrollbars=installGameScrollbars();
  watchPixelRatio();
  applyLanguage();
  frame.inert=false;
  if (loadedSave) terminal();
  document.fonts.ready.then(resize);
  if (!saveBases.get(activeSaveSlot)?.layout) saveRun();
}
startGame();
</script>
